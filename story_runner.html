<!DOCTYPE html>
<html lang="zh-TW">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>劇情 - 霓虹牌編年史</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&family=Noto+Sans+TC:wght@400;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/styles.css">
    <script src="js/theme.js"></script>
    <style>
        /* ============================================================
           STORY RUNNER — NEUBRUTALISM × DYNAMIC MANGA COMIC
           ============================================================ */

        *, *::before, *::after { box-sizing: border-box; }

        html, body {
            margin: 0; padding: 0;
            width: 100%; height: 100%;
            overflow: hidden;
            font-family: 'Space Grotesk', 'Noto Sans TC', sans-serif;
        }

        /* ── THE MANGA PAGE ── */
        .vn-container {
            position: relative;
            width: 100%;
            height: 100%;
            height: 100dvh;
            display: flex;
            flex-direction: column;
            background: #FFFBF0;
            overflow: hidden;
        }

        /* ── ATMOSPHERIC BACKGROUND (top portion = "scene panel") ── */
        .vn-scene {
            position: absolute;
            top: 0; left: 0; right: 0;
            height: 55%;
            z-index: 0;
            overflow: hidden;
        }

        /* Manga background texture */
        .vn-scene::before {
            content: '';
            position: absolute;
            inset: 0;
            background:
                radial-gradient(circle at 20% 50%, rgba(255,77,28,0.08) 0%, transparent 50%),
                radial-gradient(circle at 80% 30%, rgba(59,130,246,0.07) 0%, transparent 50%),
                radial-gradient(circle, #0A0A0A 1px, transparent 1px);
            background-size: auto, auto, 18px 18px;
        }

        /* Speed lines radiating from center */
        .vn-scene::after {
            content: '';
            position: absolute;
            inset: -100%;
            background: repeating-conic-gradient(
                from 0deg at 50% 50%,
                rgba(0,0,0,0.04) 0deg 1deg,
                transparent 1deg 5deg
            );
            animation: scenePan 80s linear infinite;
        }

        @keyframes scenePan {
            from { transform: rotate(0deg); }
            to   { transform: rotate(360deg); }
        }

        /* Background class variants */
        .bg-wasteland .vn-scene::before {
            background:
                radial-gradient(circle at 30% 60%, rgba(255,77,28,0.12) 0%, transparent 55%),
                radial-gradient(circle at 70% 20%, rgba(10,10,10,0.15) 0%, transparent 60%),
                radial-gradient(circle, #0A0A0A 1px, transparent 1px);
            background-size: auto, auto, 16px 16px;
        }

        /* ── LOCATION CAPTION (top-left manga caption box) ── */
        .vn-location {
            position: absolute;
            top: 16px;
            left: 16px;
            z-index: 10;
            background: #0A0A0A;
            color: #FFFBF0;
            font-family: 'Space Grotesk', sans-serif;
            font-size: 0.72rem;
            font-weight: 700;
            letter-spacing: 1.5px;
            text-transform: uppercase;
            padding: 7px 14px;
            border: 2px solid #0A0A0A;
            box-shadow: 3px 3px 0 rgba(255,77,28,0.6);
            display: none;
            max-width: calc(100% - 140px);
            line-height: 1.3;
            animation: locationSlideIn 0.3s ease forwards;
        }

        @keyframes locationSlideIn {
            from { opacity: 0; transform: translateX(-10px); }
            to   { opacity: 1; transform: translateX(0); }
        }

        /* ── SKIP BUTTON ── */
        .skip-btn {
            position: absolute;
            top: 14px;
            right: 14px;
            z-index: 20;
            background: #FFFBF0;
            border: 2px solid #0A0A0A;
            color: #0A0A0A;
            font-family: 'Space Grotesk', sans-serif;
            font-weight: 700;
            font-size: 0.75rem;
            letter-spacing: 1px;
            text-transform: uppercase;
            padding: 7px 14px;
            cursor: pointer;
            box-shadow: 2px 2px 0 #0A0A0A;
            transition: transform 0.08s ease, box-shadow 0.08s ease;
        }

        .skip-btn:hover {
            transform: translate(-1px, -1px);
            box-shadow: 3px 3px 0 #0A0A0A;
        }

        .skip-btn:active {
            transform: translate(2px, 2px);
            box-shadow: none;
        }

        /* ── PROGRESS BAR (chapter progress) ── */
        .vn-progress {
            position: absolute;
            top: 0; left: 0; right: 0;
            height: 4px;
            background: #E0DDD5;
            z-index: 15;
            border-bottom: 2px solid #0A0A0A;
        }

        .vn-progress-fill {
            height: 100%;
            background: #FF4D1C;
            transition: width 0.4s ease;
            border-right: 2px solid #0A0A0A;
        }

        /* ── SCENE DIVIDER LINE ── */
        .vn-panel-border {
            position: relative;
            z-index: 5;
            height: 6px;
            background: #0A0A0A;
            flex-shrink: 0;
        }

        /* ── DIALOGUE PANEL (bottom manga panel) ── */
        .vn-dialogue-panel {
            position: relative;
            z-index: 10;
            flex: 1;
            display: flex;
            flex-direction: column;
            background: #FFFBF0;
            background-image: radial-gradient(circle, rgba(10,10,10,0.04) 1px, transparent 1px);
            background-size: 12px 12px;
            cursor: pointer;
            overflow: hidden;
            min-height: 0;
        }

        /* Corner accent marks (manga panel frame) */
        .vn-dialogue-panel::before,
        .vn-dialogue-panel::after {
            content: '';
            position: absolute;
            width: 20px; height: 20px;
            border-color: #0A0A0A;
            border-style: solid;
            z-index: 1;
            pointer-events: none;
        }

        .vn-dialogue-panel::before {
            top: 10px; right: 10px;
            border-width: 0 3px 3px 0;
        }

        .vn-dialogue-panel::after {
            bottom: 10px; right: 10px;
            border-width: 0 3px 3px 0;
            border-color: rgba(10,10,10,0.2);
        }

        /* ── SPEAKER NAMEPLATE ── */
        .vn-speaker-wrap {
            padding: 16px 20px 0 20px;
            flex-shrink: 0;
        }

        .vn-speaker {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            background: #0A0A0A;
            color: #FFFBF0;
            font-family: 'Space Grotesk', sans-serif;
            font-size: 1rem;
            font-weight: 900;
            letter-spacing: 2px;
            text-transform: uppercase;
            padding: 6px 16px;
            box-shadow: 3px 3px 0 #FF4D1C;
            min-width: 80px;
            position: relative;
            animation: speakerPop 0.2s cubic-bezier(0.34,1.56,0.64,1) forwards;
        }

        @keyframes speakerPop {
            from { transform: scale(0.88) translateX(-6px); opacity: 0; }
            to   { transform: scale(1)    translateX(0);    opacity: 1; }
        }

        /* Special speaker colors */
        .speaker-system    { background: #0A0A0A; box-shadow: 3px 3px 0 #FFD700; }
        .speaker-narrator  { background: #333; box-shadow: 3px 3px 0 #0A0A0A; color: #FFFBF0; }
        .speaker-system-sfx { background: #FFD700; color: #0A0A0A; box-shadow: 3px 3px 0 #0A0A0A; }

        /* Speaker indicator dot */
        .speaker-dot {
            width: 8px; height: 8px;
            background: #FF4D1C;
            border: 2px solid #FFFBF0;
            border-radius: 50%;
            flex-shrink: 0;
        }

        /* ── DIALOGUE TEXT AREA ── */
        .vn-text-wrap {
            flex: 1;
            padding: 12px 22px 10px;
            display: flex;
            flex-direction: column;
            min-height: 0;
            overflow: hidden;
        }

        .vn-text {
            font-family: 'Noto Sans TC', sans-serif;
            font-size: 1.05rem;
            font-weight: 500;
            color: #0A0A0A;
            line-height: 1.75;
            white-space: pre-wrap;
            overflow-y: auto;
            flex: 1;
        }

        /* Scrollbar */
        .vn-text::-webkit-scrollbar { width: 4px; }
        .vn-text::-webkit-scrollbar-thumb { background: #0A0A0A; }

        /* ── BOTTOM BAR ── */
        .vn-bottom-bar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 8px 20px calc(8px + env(safe-area-inset-bottom));
            border-top: 2px solid rgba(10,10,10,0.12);
            flex-shrink: 0;
        }

        .vn-tap-hint {
            font-family: 'Space Grotesk', sans-serif;
            font-size: 0.65rem;
            font-weight: 700;
            color: rgba(10,10,10,0.3);
            letter-spacing: 2px;
            text-transform: uppercase;
        }

        /* ── NEXT INDICATOR ── */
        .vn-next-indicator {
            display: flex;
            align-items: center;
            gap: 6px;
            font-family: 'Space Grotesk', sans-serif;
            font-size: 0.75rem;
            font-weight: 900;
            color: #0A0A0A;
            letter-spacing: 2px;
            text-transform: uppercase;
            opacity: 0;
            transition: opacity 0.3s;
        }

        .vn-next-indicator.visible { opacity: 1; }

        .next-arrow {
            width: 20px; height: 20px;
            background: #FF4D1C;
            border: 2px solid #0A0A0A;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.7rem;
            animation: nextBounce 0.8s ease-in-out infinite alternate;
            box-shadow: 2px 2px 0 #0A0A0A;
            color: #fff;
        }

        @keyframes nextBounce {
            from { transform: translateY(0); box-shadow: 2px 2px 0 #0A0A0A; }
            to   { transform: translateY(-3px); box-shadow: 2px 5px 0 #0A0A0A; }
        }

        /* ── MANGA IMPACT TEXT (shown on special effects) ── */
        .manga-impact {
            position: fixed;
            inset: 0;
            z-index: 8000;
            pointer-events: none;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .impact-text {
            font-family: 'Space Grotesk', sans-serif;
            font-size: 8rem;
            font-weight: 900;
            color: transparent;
            -webkit-text-stroke: 4px #0A0A0A;
            letter-spacing: -5px;
            opacity: 0;
            transform: scale(0.5) rotate(-8deg);
            animation: impactPop 0.6s cubic-bezier(0.34,1.56,0.64,1) forwards;
            text-shadow: 6px 6px 0 rgba(255,77,28,0.4);
            text-align: center;
            line-height: 1;
        }

        @keyframes impactPop {
            0%   { opacity: 0; transform: scale(0.4) rotate(-12deg); }
            50%  { opacity: 1; transform: scale(1.1) rotate(-2deg); }
            80%  { opacity: 1; transform: scale(1) rotate(0deg); }
            100% { opacity: 0; transform: scale(1.05) rotate(1deg); }
        }

        /* ── EFFECTS ── */

        /* shake */
        @keyframes vnShake {
            0%   { transform: translate(0,0) rotate(0deg); }
            15%  { transform: translate(-4px,-2px) rotate(-1deg); }
            30%  { transform: translate(4px,3px) rotate(1deg); }
            45%  { transform: translate(-3px,1px) rotate(0deg); }
            60%  { transform: translate(3px,-1px) rotate(-1deg); }
            75%  { transform: translate(-2px,2px) rotate(1deg); }
            90%  { transform: translate(2px,-2px) rotate(0deg); }
            100% { transform: translate(0,0) rotate(0deg); }
        }

        .effect-shake .vn-dialogue-panel,
        .effect-shake .vn-scene {
            animation: vnShake 0.45s cubic-bezier(.36,.07,.19,.97) both;
        }

        /* flash (white) — screen overlay */
        @keyframes vnFlash {
            0%,100% { opacity: 0; }
            40%      { opacity: 1; }
        }

        .effect-flash::before {
            content: '';
            position: fixed;
            inset: 0;
            background: #FFFBF0;
            pointer-events: none;
            z-index: 9000;
            animation: vnFlash 0.35s ease-out forwards;
        }

        /* flash-red */
        @keyframes vnFlashRed {
            0%,100% { opacity: 0; }
            35%     { opacity: 0.75; }
        }

        .effect-flash-red::before {
            content: '';
            position: fixed;
            inset: 0;
            background: #FF4D1C;
            pointer-events: none;
            z-index: 9000;
            animation: vnFlashRed 0.45s ease-out forwards;
        }

        /* glitch */
        @keyframes vnGlitch {
            0%   { clip-path: inset(0% 0% 100% 0%); transform: translate(0); }
            10%  { clip-path: inset(20% 0% 40% 0%); transform: translate(-4px,0); }
            20%  { clip-path: inset(60% 0% 10% 0%); transform: translate(4px,0); }
            30%  { clip-path: inset(40% 0% 30% 0%); transform: translate(-2px,0); }
            40%  { clip-path: inset(10% 0% 70% 0%); transform: translate(3px,0); }
            50%  { clip-path: inset(70% 0% 5% 0%);  transform: translate(-3px,0); }
            100% { clip-path: inset(0% 0% 0% 0%);   transform: translate(0); }
        }

        .effect-glitch .vn-dialogue-panel {
            animation: vnGlitch 0.3s steps(1) both;
        }

        /* Glitch scan line overlay */
        .effect-glitch::after {
            content: '';
            position: fixed;
            inset: 0;
            background: repeating-linear-gradient(
                0deg,
                transparent,
                transparent 2px,
                rgba(255,77,28,0.12) 2px,
                rgba(255,77,28,0.12) 4px
            );
            pointer-events: none;
            z-index: 8500;
            animation: vnFlash 0.4s ease-out forwards;
        }

        /* pulse-red — persistent danger border */
        @keyframes vnPulseRed {
            0%,100% { box-shadow: inset 0 0 0 0 rgba(255,77,28,0); }
            50%     { box-shadow: inset 0 0 0 8px rgba(255,77,28,0.5); }
        }

        .effect-pulse-red .vn-container {
            animation: vnPulseRed 1.8s ease-in-out infinite;
        }

        /* ── SCENE PANEL CLASSES for mood ── */
        .bg-wasteland .vn-scene { background: #C8C5BE; }
        .bg-battle    .vn-scene { background: #2a1a1a; }

        /* ── CHAPTER COMPLETE MODAL (Neubrutalism) ── */
        .chapter-modal-overlay {
            position: fixed;
            inset: 0;
            background: rgba(255,251,240,0.92);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 9500;
        }

        .chapter-modal-overlay.active { display: flex; }

        .chapter-modal-card {
            background: #FFFBF0;
            border: 3px solid #0A0A0A;
            box-shadow: 8px 8px 0 #0A0A0A;
            padding: 40px 44px;
            text-align: center;
            max-width: 420px;
            width: 90%;
            animation: modalPop 0.4s cubic-bezier(0.34,1.56,0.64,1) forwards;
            position: relative;
            overflow: hidden;
        }

        @keyframes modalPop {
            from { transform: scale(0.8) translateY(20px); opacity: 0; }
            to   { transform: scale(1) translateY(0);    opacity: 1; }
        }

        /* Comic panel diagonal stripe accent */
        .chapter-modal-card::before {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0;
            height: 6px;
            background: #FF4D1C;
            border-bottom: 2px solid #0A0A0A;
        }

        /* Halftone bg on modal */
        .chapter-modal-card::after {
            content: '';
            position: absolute;
            inset: 0;
            background: radial-gradient(circle, #0A0A0A 1px, transparent 1px);
            background-size: 14px 14px;
            opacity: 0.04;
            pointer-events: none;
        }

        .modal-big-icon {
            font-size: 4rem;
            margin-bottom: 12px;
            display: block;
        }

        .modal-heading {
            font-family: 'Space Grotesk', sans-serif;
            font-size: 2rem;
            font-weight: 900;
            color: #0A0A0A;
            letter-spacing: -1px;
            -webkit-text-stroke: 0.5px #0A0A0A;
            margin-bottom: 10px;
        }

        .modal-subtext {
            font-size: 0.9rem;
            color: #555;
            font-weight: 500;
            margin-bottom: 28px;
            line-height: 1.5;
        }

        .modal-btn-row {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .nb-btn {
            width: 100%;
            padding: 14px 24px;
            font-family: 'Space Grotesk', sans-serif;
            font-size: 0.95rem;
            font-weight: 900;
            letter-spacing: 1px;
            text-transform: uppercase;
            border: 2px solid #0A0A0A;
            cursor: pointer;
            transition: transform 0.08s ease, box-shadow 0.08s ease;
            box-shadow: 4px 4px 0 #0A0A0A;
        }

        .nb-btn:hover {
            transform: translate(-2px,-2px);
            box-shadow: 6px 6px 0 #0A0A0A;
        }

        .nb-btn:active {
            transform: translate(4px,4px);
            box-shadow: none;
        }

        .nb-btn-primary {
            background: #FF4D1C;
            color: #FFFBF0;
        }

        .nb-btn-secondary {
            background: #FFFBF0;
            color: #0A0A0A;
        }

        /* ── LINE COUNTER (bottom left) ── */
        .vn-line-counter {
            font-family: 'Space Grotesk', sans-serif;
            font-size: 0.62rem;
            font-weight: 700;
            color: rgba(10,10,10,0.25);
            letter-spacing: 1px;
        }

        /* ── RESPONSIVE ── */
        @media (max-width: 600px) {
            .vn-text     { font-size: 0.95rem; }
            .vn-speaker  { font-size: 0.88rem; }
            .impact-text { font-size: 5rem; }
            .vn-scene    { height: 42%; }
        }

        @media (min-width: 1024px) {
            .vn-container {
                max-width: 700px;
                margin: 0 auto;
                box-shadow: 0 0 0 2px #0A0A0A, 8px 0 0 #0A0A0A, -8px 0 0 #0A0A0A;
            }
        }
    </style>
</head>

<body>
    <div class="vn-container" id="vnContainer" onclick="nextDialogue()">

        <!-- Progress Bar -->
        <div class="vn-progress">
            <div class="vn-progress-fill" id="vnProgress" style="width:0%"></div>
        </div>

        <!-- Scene Panel (top atmospheric area) -->
        <div class="vn-scene" id="vnBg"></div>

        <!-- Location Caption Box -->
        <div class="vn-location" id="vnLocation"></div>

        <!-- Skip Button -->
        <button class="skip-btn" onclick="skipDialogue(event)">跳過 ▶</button>

        <!-- Thick panel border -->
        <div class="vn-panel-border" style="margin-top: 55%;"></div>

        <!-- Dialogue Panel -->
        <div class="vn-dialogue-panel" id="vnDialoguePanel">

            <!-- Speaker Nameplate -->
            <div class="vn-speaker-wrap">
                <div class="vn-speaker" id="vnSpeaker">
                    <div class="speaker-dot"></div>
                    <span id="vnSpeakerName">—</span>
                </div>
            </div>

            <!-- Text -->
            <div class="vn-text-wrap">
                <div class="vn-text" id="vnText"></div>
            </div>

            <!-- Bottom Bar -->
            <div class="vn-bottom-bar">
                <div class="vn-line-counter" id="vnLineCounter">—</div>
                <div class="vn-next-indicator" id="vnNext">
                    <span style="font-size:0.65rem;letter-spacing:1px;opacity:0.6;">點擊繼續</span>
                    <div class="next-arrow">▶</div>
                </div>
            </div>
        </div>
    </div>

    <!-- Manga Impact Overlay (for effects) -->
    <div class="manga-impact" id="mangaImpact" style="display:none;"></div>

    <!-- Chapter Complete Modal -->
    <div class="chapter-modal-overlay" id="chapterCompleteModal">
        <div class="chapter-modal-card">
            <span class="modal-big-icon">📖</span>
            <div class="modal-heading">章節完成！</div>
            <div class="modal-subtext">新的劇情與挑戰已解鎖<br>繼續你的旅程吧</div>
            <div class="modal-btn-row">
                <button class="nb-btn nb-btn-primary" onclick="location.href='story_menu.html'">
                    ← 返回編年史
                </button>
            </div>
        </div>
    </div>

    <!-- Scripts -->
    <script src="js/data/story.js"></script>
    <script>
        // ── State ──────────────────────────────────────────────────
        let currentChapterId = localStorage.getItem('story_current_chapter');
        let currentNodeIndex = parseInt(localStorage.getItem('story_current_node'), 10);
        let chapter = STORY_CHAPTERS.find(c => c.id === currentChapterId);
        let node = chapter ? chapter.nodes[currentNodeIndex] : null;

        if (!chapter || !node || node.type !== 'dialogue') {
            console.error('Invalid story state', { chapter, node });
            location.href = 'story_menu.html';
        }

        let currentLine = 0;
        let isTyping = false;
        let typingTimer = null;
        let targetText = '';

        if (currentNodeIndex === 0 && currentLine === 0) {
            localStorage.removeItem('story_current_location');
        }
        let savedLocation = localStorage.getItem('story_current_location') || '';

        // ── Speaker styling helpers ────────────────────────────────
        const SPEAKER_STYLES = {
            '系統':        'speaker-system',
            '系統提示音':   'speaker-system-sfx',
            '旁白':        'speaker-narrator',
            '廣播 (系統)': 'speaker-system',
        };

        function getSpeakerClass(name) {
            return SPEAKER_STYLES[name] || '';
        }

        // ── Render dialogue ────────────────────────────────────────
        function renderDialogue() {
            if (currentLine >= node.conversations.length) {
                finishNode();
                return;
            }

            const dialogue = node.conversations[currentLine];

            // Progress bar
            const pct = Math.round((currentLine / node.conversations.length) * 100);
            document.getElementById('vnProgress').style.width = pct + '%';

            // Line counter
            document.getElementById('vnLineCounter').textContent =
                `${currentLine + 1} / ${node.conversations.length}`;

            // ── Location parsing ──────────────────────────────────
            if (dialogue.speaker === '系統' && dialogue.text.includes('地點：')) {
                const locMatch = dialogue.text.match(/地點：([^\n]+)/);
                savedLocation = locMatch ? locMatch[1].trim()
                                         : dialogue.text.replace('地點：','').trim();
                localStorage.setItem('story_current_location', savedLocation);
            } else if (dialogue.speaker === '系統' && dialogue.text === '怪人谷的日常') {
                savedLocation = '怪人谷';
                localStorage.setItem('story_current_location', savedLocation);
            } else if (dialogue.speaker === '系統' && dialogue.text.includes('回到至高數據塔')) {
                savedLocation = '虛擬第 1 區 — 至高數據塔（The Ivory Spire）';
                localStorage.setItem('story_current_location', savedLocation);
            }

            if (!savedLocation) {
                const defaults = {
                    main_1: '虛擬第 7 區 — 破碎程式碼荒原',
                    main_2: '虛擬第 8 區 — 手搖飲流域（The Sugar-Ice Valley）',
                    main_3: '虛擬第 1 區 — 至高數據塔（The Ivory Spire）',
                    main_4: '虛擬第 4 區 — 草東街（The Melancholy Street）',
                    main_5: '虛擬第 9 區 — 資源回收筒（The Recycle Bin）',
                    main_6: '虛擬第 9 區 — 資源回收筒與至高數據塔交界',
                };
                savedLocation = defaults[chapter.id] || '';
                if (savedLocation) localStorage.setItem('story_current_location', savedLocation);
            }

            const locationEl = document.getElementById('vnLocation');
            if (savedLocation) {
                locationEl.textContent = '📍 ' + savedLocation;
                locationEl.style.display = 'block';
            } else {
                locationEl.style.display = 'none';
            }

            // ── Speaker nameplate ─────────────────────────────────
            const speakerEl  = document.getElementById('vnSpeaker');
            const speakerName = document.getElementById('vnSpeakerName');
            speakerEl.className = 'vn-speaker ' + getSpeakerClass(dialogue.speaker || '');
            speakerName.textContent = dialogue.speaker || '';

            // Force re-animation by cloning
            const clone = speakerEl.cloneNode(true);
            speakerEl.parentNode.replaceChild(clone, speakerEl);

            // ── Effects ───────────────────────────────────────────
            document.body.classList.remove(
                'effect-shake','effect-flash','effect-flash-red',
                'effect-glitch','effect-pulse-red'
            );

            if (dialogue.effect) {
                triggerEffect(dialogue.effect);
            }

            // ── Typewriter ────────────────────────────────────────
            targetText = dialogue.text || '';
            document.getElementById('vnText').textContent = '';
            document.getElementById('vnNext').classList.remove('visible');

            isTyping = true;
            let charIndex = 0;
            clearInterval(typingTimer);

            // Speed: narrator/system get faster type speed
            const speed = ['旁白','系統','系統提示音'].includes(dialogue.speaker) ? 22 : 28;

            typingTimer = setInterval(() => {
                if (charIndex < targetText.length) {
                    document.getElementById('vnText').textContent =
                        targetText.slice(0, ++charIndex);
                } else {
                    finishTyping();
                }
            }, speed);
        }

        // ── Effects system ─────────────────────────────────────────
        function triggerEffect(effect) {
            document.body.classList.add('effect-' + effect);

            if (effect !== 'pulse-red') {
                setTimeout(() => {
                    document.body.classList.remove('effect-' + effect);
                }, 700);
            }

            // Manga impact overlays for dramatic effects
            const impactMap = {
                'shake':     { text: '!!',    dur: 600  },
                'flash':     { text: 'BANG',  dur: 500  },
                'flash-red': { text: 'KRACK', dur: 600  },
                'glitch':    { text: 'ERROR', dur: 500  },
            };

            if (impactMap[effect]) {
                showImpact(impactMap[effect].text, impactMap[effect].dur);
            }
        }

        function showImpact(text, dur) {
            const el = document.getElementById('mangaImpact');
            el.innerHTML = `<div class="impact-text">${text}</div>`;
            el.style.display = 'flex';
            setTimeout(() => {
                el.style.display = 'none';
                el.innerHTML = '';
            }, dur);
        }

        // ── Typing ─────────────────────────────────────────────────
        function finishTyping() {
            clearInterval(typingTimer);
            isTyping = false;
            document.getElementById('vnText').textContent = targetText;
            document.getElementById('vnNext').classList.add('visible');
            // Progress to 100% when done
            const pct = Math.round(((currentLine + 1) / node.conversations.length) * 100);
            document.getElementById('vnProgress').style.width = pct + '%';
        }

        function nextDialogue(e) {
            if (isTyping) {
                finishTyping();
            } else {
                currentLine++;
                renderDialogue();
            }
        }

        function skipDialogue(e) {
            if (e) e.stopPropagation();
            finishNode();
        }

        // ── Finish node ────────────────────────────────────────────
        function finishNode() {
            document.getElementById('vnProgress').style.width = '100%';
            unlockNextNode(currentChapterId, currentNodeIndex);

            const nextIndex = currentNodeIndex + 1;
            if (nextIndex < chapter.nodes.length) {
                localStorage.setItem('story_current_node', nextIndex);
                const nextNode = chapter.nodes[nextIndex];
                if (nextNode.type === 'dialogue') {
                    location.reload();
                } else if (nextNode.type === 'battle') {
                    localStorage.setItem('gameMode', 'story');
                    location.href = 'game.html';
                }
            } else {
                document.getElementById('chapterCompleteModal').classList.add('active');
            }
        }

        // ── Init ───────────────────────────────────────────────────
        if (node && node.background) {
            document.getElementById('vnContainer').classList.add(node.background);
        }

        document.addEventListener('keydown', e => {
            if (e.code === 'Space' || e.code === 'Enter') {
                const modal = document.getElementById('chapterCompleteModal');
                if (modal && modal.classList.contains('active')) {
                    location.href = 'story_menu.html';
                    return;
                }
                e.preventDefault();
                nextDialogue();
            }
        });

        if (node) renderDialogue();
    </script>
</body>

</html>
