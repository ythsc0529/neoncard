<!DOCTYPE html>
<html lang="zh-TW">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>霓虹牌 - 兌換碼</title>
    <link rel="stylesheet" href="css/styles.css">
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
    <script src="js/core/auth.js"></script>
    <script src="js/core/userProfile.js"></script>
    <script src="js/data/redeemData.js"></script>
    <script src="js/ui/soundManager.js"></script>
    <script src="js/core/notificationManager.js"></script>
    <style>
        body {
            background-color: var(--bg-dark);
            background-image: var(--comic-halftone);
            background-size: 20px 20px;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .redeem-wrapper {
            width: 90%;
            max-width: 480px;
        }

        /* ── Back Link ── */
        .back-link {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            color: var(--text-primary);
            text-decoration: none;
            font-family: var(--font-heading);
            font-weight: 700;
            font-size: 0.88rem;
            letter-spacing: 1px;
            text-transform: uppercase;
            border: var(--nb-border-width) solid var(--nb-border);
            border-radius: 4px;
            padding: 8px 16px;
            background: var(--bg-card);
            box-shadow: var(--nb-shadow-sm);
            transition: transform 0.08s ease, box-shadow 0.08s ease;
            margin-bottom: 20px;
        }

        .back-link:hover {
            transform: translate(-2px, -2px);
            box-shadow: var(--nb-shadow);
        }

        .back-link:active {
            transform: translate(3px, 3px);
            box-shadow: none;
        }

        /* ── Main Card ── */
        .redeem-container {
            background: var(--bg-card);
            border: var(--nb-border-width) solid var(--nb-border);
            border-radius: 4px;
            box-shadow: var(--nb-shadow-xl);
            overflow: hidden;
        }

        /* Accent Header Bar */
        .redeem-header {
            background: var(--color-cta);
            border-bottom: var(--nb-border-width) solid var(--nb-border);
            padding: 20px 32px;
            display: flex;
            align-items: center;
            gap: 16px;
        }

        .redeem-icon {
            font-size: 2.5rem;
            line-height: 1;
        }

        .redeem-header-text {}

        .redeem-title {
            font-family: var(--font-heading);
            font-size: 1.8rem;
            font-weight: 900;
            color: var(--nb-border);
            letter-spacing: -0.5px;
            -webkit-text-stroke: 0.5px var(--nb-border);
            text-transform: uppercase;
        }

        .redeem-header-sub {
            font-size: 0.8rem;
            font-weight: 700;
            color: var(--nb-border);
            opacity: 0.65;
            text-transform: uppercase;
            letter-spacing: 1.5px;
        }

        .redeem-body {
            padding: 32px;
        }

        .redeem-desc {
            color: var(--text-secondary);
            font-size: 0.95rem;
            margin-bottom: 24px;
            line-height: 1.6;
            font-weight: 500;
        }

        .redeem-input {
            background: var(--bg-secondary);
            border: var(--nb-border-width) solid var(--nb-border);
            border-radius: 4px;
            padding: 16px 18px;
            font-size: 1.2rem;
            font-family: var(--font-heading);
            font-weight: 700;
            color: var(--text-primary);
            text-align: center;
            width: 100%;
            margin-bottom: 16px;
            outline: none;
            transition: transform 0.08s ease, box-shadow 0.08s ease;
            text-transform: uppercase;
            letter-spacing: 3px;
            box-shadow: var(--nb-shadow-sm);
        }

        .redeem-input::placeholder {
            color: var(--text-muted);
            font-weight: 400;
            letter-spacing: 1px;
        }

        .redeem-input:focus {
            transform: translate(-2px, -2px);
            box-shadow: var(--nb-shadow);
            border-color: var(--color-primary);
        }

        .btn-redeem {
            width: 100%;
            padding: 16px;
            font-size: 1.1rem;
            letter-spacing: 2px;
        }

        .redeem-divider {
            border: none;
            border-top: var(--nb-border-width) solid var(--bg-secondary);
            margin: 24px 0;
        }

        .redeem-tip {
            display: flex;
            align-items: flex-start;
            gap: 10px;
            background: var(--bg-secondary);
            border: 2px solid var(--nb-border);
            border-radius: 4px;
            padding: 12px 16px;
            font-size: 0.82rem;
            color: var(--text-secondary);
            font-weight: 500;
        }

        .redeem-tip-icon { font-size: 1rem; flex-shrink: 0; }
    </style>
</head>

<body>
    <div class="redeem-wrapper">
        <a href="index.html" class="back-link">← 返回大廳</a>

        <div class="redeem-container">
            <!-- Header -->
            <div class="redeem-header">
                <div class="redeem-icon">🎁</div>
                <div class="redeem-header-text">
                    <div class="redeem-title">禮包兌換</div>
                    <div class="redeem-header-sub">Gift Code Redemption</div>
                </div>
            </div>

            <!-- Body -->
            <div class="redeem-body">
                <p class="redeem-desc">請輸入您獲得的兌換碼以領取獎勵。兌換碼不分大小寫。</p>

                <input type="text" id="codeInput" class="redeem-input" placeholder="輸入兌換碼..." maxlength="20">
                <button class="btn btn-gold btn-redeem" onclick="submitRedeem()">馬上兌換 →</button>

                <hr class="redeem-divider">

                <div class="redeem-tip">
                    <span class="redeem-tip-icon">💡</span>
                    <span>兌換碼可在官方社群媒體、賽事活動及開發者公告中取得。每個帳號每個代碼只能兌換一次。</span>
                </div>
            </div>
        </div>
    </div>

    <script>
        let myProfile = null;

        AuthManager.init();
        AuthManager.onAuthChanged(async (user) => {
            if (!user) { location.href = 'index.html'; return; }
            myProfile = await UserProfile.getProfile(user.uid);
        });

        async function submitRedeem() {
            const input = document.getElementById('codeInput');
            const code = input.value.trim().toUpperCase();
            
            if (!code) {
                alert("請輸入兌換碼！");
                return;
            }
            
            if (!myProfile) return;
            
            if ((myProfile.redeemedCodes || []).includes(code)) {
                alert("您已經兌換過這個代碼了！");
                return;
            }

            const codeInfo = RedeemLogic.validateCode(code);
            if (!codeInfo) {
                alert("無效的兌換碼或已過期！");
                return;
            }

            try {
                // Apply Rewards
                for (const r of codeInfo.rewards) {
                    if (r.type === 'title') {
                        await UserProfile.unlockTitle(myProfile.uid, r.name);
                        myProfile.titles = myProfile.titles || [];
                        if (!myProfile.titles.includes(r.name)) myProfile.titles.push(r.name);
                    } else if (r.type === 'exp') {
                        await UserProfile.gainExp(myProfile.uid, r.amt);
                    } else {
                        // money, drawNormal, drawPremium, drawSpecial, landDeed, etc.
                        await UserProfile.updateInventory(myProfile.uid, r.type, r.amt);
                    }
                }

                // Add to redeemed
                const arr = myProfile.redeemedCodes || [];
                arr.push(code);
                await UserProfile.updateProfile(myProfile.uid, { redeemedCodes: arr });
                
                if (window.SoundManager) SoundManager.play('money');
                alert(`🎊 兌換成功：${codeInfo.name}！\n獲得：${codeInfo.desc}`);
                input.value = '';

                // Refresh global notification dots
                if (typeof NotificationManager !== 'undefined') NotificationManager.refresh(myProfile);
                
            } catch (err) {
                alert("發生錯誤：" + err.message);
            }
        }
    </script>
</body>
</html>
