<!DOCTYPE html>
<html lang="zh-TW">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>霓虹牌 - 隊伍配置與圖鑑</title>
    <link rel="stylesheet" href="css/styles.css">
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
    <script src="js/theme.js"></script>
    <script src="js/core/auth.js"></script>
    <script src="js/core/userProfile.js"></script>
    <script src="js/data/characters_part1.js"></script>
    <script src="js/data/characters_part2.js"></script>
    <script src="js/data/characters_part3.js"></script>
    <script src="js/data/characters_part4.js"></script>
    <script src="js/data/characters_part5.js"></script>
    <script src="js/data/characters_part6.js"></script>
    <script src="js/data/characters.js"></script>
    <style>
        body {
            background-color: var(--bg-dark);
            background-image: var(--comic-halftone);
            background-size: 20px 20px;
            min-height: 100vh;
            color: var(--text-primary);
        }

        .team-page {
            max-width: 1200px;
            margin: 0 auto;
            padding: 28px 20px 40px;
        }

        /* ── Header ── */
        .header-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 16px;
            margin-bottom: 28px;
            flex-wrap: wrap;
        }

        .back-btn {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            color: var(--text-primary);
            text-decoration: none;
            font-family: var(--font-heading);
            font-weight: 700;
            font-size: 0.9rem;
            letter-spacing: 1px;
            text-transform: uppercase;
            border: var(--nb-border-width) solid var(--nb-border);
            border-radius: 4px;
            padding: 8px 16px;
            background: var(--bg-card);
            box-shadow: var(--nb-shadow-sm);
            transition: transform 0.08s ease, box-shadow 0.08s ease;
        }

        .back-btn:hover {
            transform: translate(-2px, -2px);
            box-shadow: var(--nb-shadow);
        }

        .back-btn:active {
            transform: translate(3px, 3px);
            box-shadow: none;
        }

        .page-title-block {
            flex: 1;
        }

        .page-title {
            font-family: var(--font-heading);
            font-size: 1.8rem;
            font-weight: 900;
            color: var(--text-primary);
            letter-spacing: -0.5px;
            -webkit-text-stroke: 0.5px var(--nb-border);
            text-transform: uppercase;
        }

        .page-subtitle {
            font-size: 0.8rem;
            color: var(--text-muted);
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 1.5px;
        }

        /* ── Stats Bar ── */
        .stats-bar {
            background: var(--color-primary);
            border: var(--nb-border-width) solid var(--nb-border);
            border-radius: 4px;
            padding: 10px 20px;
            font-family: var(--font-heading);
            font-size: 1rem;
            font-weight: 900;
            color: #FFFFFF;
            box-shadow: var(--nb-shadow-sm);
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        /* ── Filters ── */
        .filters-bar {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-bottom: 24px;
            flex-wrap: wrap;
        }

        .filter-label {
            font-family: var(--font-heading);
            font-size: 0.78rem;
            font-weight: 900;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 1.5px;
            margin-right: 4px;
        }

        .filter-btn {
            background: var(--bg-card);
            border: var(--nb-border-width) solid var(--nb-border);
            color: var(--text-secondary);
            padding: 8px 18px;
            border-radius: 4px;
            cursor: pointer;
            font-family: var(--font-heading);
            font-size: 0.85rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            transition: transform 0.08s ease, box-shadow 0.08s ease;
            box-shadow: var(--nb-shadow-sm);
        }

        .filter-btn:hover {
            transform: translate(-1px, -1px);
            box-shadow: var(--nb-shadow);
            background: var(--glass-bg-hover);
        }

        .filter-btn:active {
            transform: translate(3px, 3px);
            box-shadow: none;
        }

        .filter-btn.active {
            background: var(--color-primary);
            color: #FFFFFF;
            border-color: var(--nb-border);
            box-shadow: var(--nb-shadow-sm);
        }

        .filter-btn.active:hover {
            background: #E63A0F;
            transform: translate(-1px, -1px);
            box-shadow: var(--nb-shadow);
        }

        /* ── Character Grid (reuse global .character-card) ── */
        .char-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 20px;
        }

        .character-card.locked {
            filter: grayscale(1) opacity(0.5);
            cursor: not-allowed;
        }

        .character-card.locked:hover {
            transform: none;
            box-shadow: var(--nb-shadow);
            border-color: var(--nb-border);
        }

        /* ── Empty State ── */
        .empty-state-nb {
            grid-column: 1 / -1;
            text-align: center;
            padding: 60px 20px;
            background: var(--bg-card);
            border: var(--nb-border-width) solid var(--nb-border);
            border-radius: 4px;
            box-shadow: var(--nb-shadow-sm);
        }

        .empty-state-nb .icon {
            font-size: 3rem;
            margin-bottom: 12px;
        }

        .empty-state-nb p {
            color: var(--text-muted);
            font-family: var(--font-heading);
            font-size: 0.95rem;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
    </style>
</head>

<body>
    <div id="pageLoading" style="position:fixed;inset:0;background:var(--bg-dark);background-image:var(--comic-halftone);background-size:20px 20px;display:flex;align-items:center;justify-content:center;z-index:9999;">
        <div style="text-align:center;">
            <div style="font-family:var(--font-heading);font-size:2rem;font-weight:900;color:var(--text-primary);-webkit-text-stroke:1px var(--nb-border);margin-bottom:16px;animation:pulse 1.5s infinite;">霓虹牌</div>
            <div style="width:200px;height:12px;background:var(--bg-secondary);border:var(--nb-border-width) solid var(--nb-border);border-radius:4px;overflow:hidden;box-shadow:var(--nb-shadow-sm);margin:0 auto;">
                <div style="height:100%;width:60%;background:var(--color-primary);animation:pulse 1s infinite;border-right:2px solid var(--nb-border);"></div>
            </div>
            <div style="font-family:var(--font-heading);font-size:0.75rem;color:var(--text-muted);text-transform:uppercase;letter-spacing:2px;font-weight:700;margin-top:10px;">LOADING...</div>
        </div>
    </div>

    <div class="team-page" id="teamPage" style="display:none;">
        <div class="header-row">
            <a href="index.html" class="back-btn">← 返回大廳</a>
            <div class="page-title-block">
                <div class="page-title">隊伍配置</div>
                <div class="page-subtitle">Team Collection &amp; Compendium</div>
            </div>
            <div class="stats-bar" id="collectionStats">收集度: 0 / 0 (0%)</div>
        </div>

        <div class="filters-bar">
            <span class="filter-label">篩選：</span>
            <button class="filter-btn active" onclick="setFilter('all', this)">全部</button>
            <button class="filter-btn" onclick="setFilter('owned', this)">已擁有</button>
            <button class="filter-btn" onclick="setFilter('unowned', this)">未擁有</button>
        </div>

        <div class="char-grid" id="charGrid">
            <!-- Rendered by JS -->
        </div>
    </div>

    <script>
        let myProfile = null;
        let allChars = [];
        let currentFilter = 'all';

        AuthManager.init();
        AuthManager.onAuthChanged(async (user) => {
            if (!user) { location.href = 'index.html'; return; }
            myProfile = await UserProfile.getProfile(user.uid);
            
            if (typeof ALL_CHARACTERS !== 'undefined') allChars = ALL_CHARACTERS;
            else if (typeof window.characters !== 'undefined') allChars = window.characters;
            
            renderCollection();
            document.getElementById('pageLoading').style.display = 'none';
            document.getElementById('teamPage').style.display = 'block';
        });

        function setFilter(filt, btn) {
            currentFilter = filt;
            document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            renderCollection();
        }

        function renderCollection() {
            const grid = document.getElementById('charGrid');
            grid.innerHTML = '';
            
            const ownedNames = myProfile.unlockedCharacters || [];
            document.getElementById('collectionStats').textContent = `收集度: ${ownedNames.length} / ${allChars.length} (${Math.round(ownedNames.length / allChars.length * 100)}%)`;
            
            let displayList = allChars;
            if(currentFilter === 'owned') displayList = displayList.filter(c => ownedNames.includes(c.name));
            if(currentFilter === 'unowned') displayList = displayList.filter(c => !ownedNames.includes(c.name));
            
            if (displayList.length === 0) {
                grid.innerHTML = `<div class="empty-state-nb"><div class="icon">🃏</div><p>此篩選條件下沒有角色</p></div>`;
                return;
            }

            // Sort: Owned first, then descending rarity
            const rarityOrder = { MYTHIC: 5, LEGENDARY: 4, EPIC: 3, RARE: 2, COMMON: 1, SPECIAL: 0 };
            displayList.sort((a, b) => {
                const aOwned = ownedNames.includes(a.name) ? 1 : 0;
                const bOwned = ownedNames.includes(b.name) ? 1 : 0;
                if (aOwned !== bOwned) return bOwned - aOwned;
                return (rarityOrder[b.rarity] || 0) - (rarityOrder[a.rarity] || 0);
            });
            
            displayList.forEach(c => {
                const isOwned = ownedNames.includes(c.name);
                const rarityClass = `rarity-${(c.rarity || 'COMMON').toLowerCase()}`;
                const rarityNameMap = { 'COMMON': '一般', 'RARE': '稀有', 'EPIC': '史詩', 'LEGENDARY': '傳說', 'MYTHIC': '神話', 'SPECIAL': '特殊' };
                const rarityTrans = rarityNameMap[c.rarity] || c.rarity;
                
                const card = document.createElement('div');
                card.className = `character-card glass ${rarityClass} ${isOwned ? '' : 'locked'}`;
                
                const hpVal = typeof c.hp === 'object' ? `${c.hp.min}~${c.hp.max}` : (c.hp || '?');
                const atkVal = typeof c.atk === 'object' ? `${c.atk.min}~${c.atk.max}` : (c.atk || '?');
                
                card.innerHTML = `
                    <div class="character-header">
                        <span class="character-id">#${c.id || '?'}</span>
                        <span class="character-rarity ${rarityClass}">${rarityTrans}</span>
                    </div>
                    ${c.emoji ? `<div style="font-size:2rem;text-align:center;margin:5px 0;">${c.emoji}</div>` : ''}
                    <div class="character-name">${c.name}</div>
                    <div class="character-stats">
                        <span class="stat"><span class="stat-label stat-hp">❤</span> ${hpVal}</span>
                        <span class="stat"><span class="stat-label stat-atk">⚔</span> ${atkVal}</span>
                    </div>
                    <div class="character-skills">
                        ${c.skills && c.skills.length > 0
                        ? c.skills.slice(0, 2).map(s =>
                            `<div class="skill-item"><span class="skill-name">${s.name}</span> (CD: ${s.cd})</div>`
                        ).join('')
                        : '<div class="skill-item" style="color: #666;">無技能</div>'
                        }
                        ${c.passive
                        ? `<div class="skill-item passive-item"><span style="color: var(--neon-gold);">[被動] ${c.passive.name}</span></div>`
                        : ''
                        }
                    </div>
                `;
                
                card.onclick = () => {
                    if(isOwned) {
                        const skillList = (c.skills || []).map(s => `• ${s.name}: ${s.desc}`).join('\n');
                        alert(`【${c.name}】\nHP: ${hpVal} | ATK: ${atkVal}\n\n技能:\n${skillList || '無'}`);
                    } else {
                        alert(`尚未解鎖【${c.name}】！`);
                    }
                };
                
                grid.appendChild(card);
            });
        }
    </script>
</body>
</html>
