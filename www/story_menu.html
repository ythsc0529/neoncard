<!DOCTYPE html>
<html lang="zh-TW">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>編年史 - 霓虹牌</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&family=Noto+Sans+TC:wght@400;700;900&family=Inter:wght@400;500;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/styles.css">
    <script src="js/theme.js"></script>
    <style>
        /* ============================================================
           STORY MENU — NEUBRUTALISM × DYNAMIC MANGA COMIC
           ============================================================ */

        body {
            background-color: var(--bg-dark);
            background-image: var(--comic-halftone);
            background-size: 20px 20px;
            min-height: 100vh;
            overflow-x: hidden;
        }

        /* ── SPEED LINES background decoration ── */
        body::before {
            content: '';
            position: fixed;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: repeating-conic-gradient(
                from 0deg at 50% 50%,
                rgba(0,0,0,0.018) 0deg 1deg,
                transparent 1deg 6deg
            );
            pointer-events: none;
            z-index: 0;
            animation: slowSpin 120s linear infinite;
        }

        @keyframes slowSpin {
            from { transform: rotate(0deg); }
            to   { transform: rotate(360deg); }
        }

        .story-menu-container {
            position: relative;
            z-index: 1;
            width: 100%;
            max-width: 860px;
            margin: 0 auto;
            padding: 28px 20px 60px;
        }

        /* ── TOP BAR ── */
        .top-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            width: 100%;
            margin-bottom: 36px;
            gap: 12px;
        }

        .back-btn {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            color: var(--text-primary);
            text-decoration: none;
            font-family: var(--font-heading);
            font-weight: 700;
            font-size: 0.88rem;
            letter-spacing: 1px;
            text-transform: uppercase;
            border: var(--nb-border-width) solid var(--nb-border);
            border-radius: 4px;
            padding: 9px 18px;
            background: var(--bg-card);
            box-shadow: var(--nb-shadow-sm);
            transition: transform 0.08s ease, box-shadow 0.08s ease;
        }

        .back-btn:hover {
            transform: translate(-2px, -2px);
            box-shadow: var(--nb-shadow);
        }

        .back-btn:active {
            transform: translate(3px, 3px);
            box-shadow: none;
        }

        /* ── MANGA TITLE ── */
        .manga-title-block {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 4px;
        }

        .manga-title {
            font-family: var(--font-heading);
            font-size: 2.4rem;
            font-weight: 900;
            color: var(--text-primary);
            letter-spacing: -1px;
            -webkit-text-stroke: 1px var(--nb-border);
            line-height: 1;
            text-align: center;
        }

        .manga-subtitle {
            font-family: var(--font-heading);
            font-size: 0.62rem;
            font-weight: 700;
            letter-spacing: 4px;
            color: var(--text-muted);
            text-transform: uppercase;
        }

        /* ── TAB STRIP ── */
        .tabs {
            display: flex;
            border: var(--nb-border-width) solid var(--nb-border);
            border-radius: 4px;
            overflow: hidden;
            margin-bottom: 32px;
            box-shadow: var(--nb-shadow);
            background: var(--bg-secondary);
        }

        .tab-btn {
            flex: 1;
            padding: 14px 8px;
            background: transparent;
            border: none;
            border-right: var(--nb-border-width) solid var(--nb-border);
            color: var(--text-muted);
            font-family: var(--font-heading);
            font-size: 0.95rem;
            font-weight: 700;
            cursor: pointer;
            transition: background 0.1s, color 0.1s;
            letter-spacing: 0.5px;
            text-transform: uppercase;
        }

        .tab-btn:last-child { border-right: none; }
        .tab-btn:hover { background: var(--glass-bg-hover); color: var(--text-primary); }

        .tab-btn.active {
            background: var(--bg-card);
            color: var(--color-primary);
            font-weight: 900;
        }

        /* ── CHAPTER LIST ── */
        .chapter-list {
            display: flex;
            flex-direction: column;
            gap: 0;
        }

        /* ── CHAPTER CARD — MANGA PANEL ── */
        .chapter-card {
            position: relative;
            background: var(--bg-card);
            border: var(--nb-border-width) solid var(--nb-border);
            border-bottom: none;
            overflow: hidden;
            animation: panelSlideIn 0.35s cubic-bezier(0.2, 0.8, 0.2, 1) backwards;
        }

        .chapter-card:last-child {
            border-bottom: var(--nb-border-width) solid var(--nb-border);
            box-shadow: var(--nb-shadow-lg);
        }

        .chapter-card:not(.locked):hover {
            background: var(--glass-bg-hover);
        }

        @keyframes panelSlideIn {
            from { opacity: 0; transform: translateY(16px); }
            to   { opacity: 1; transform: translateY(0); }
        }

        /* Stagger animation delays */
        .chapter-card:nth-child(1)  { animation-delay: 0.05s; }
        .chapter-card:nth-child(2)  { animation-delay: 0.10s; }
        .chapter-card:nth-child(3)  { animation-delay: 0.15s; }
        .chapter-card:nth-child(4)  { animation-delay: 0.20s; }
        .chapter-card:nth-child(5)  { animation-delay: 0.25s; }
        .chapter-card:nth-child(n+6){ animation-delay: 0.30s; }

        /* Comic speed lines on hover */
        .chapter-card::before {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background: var(--comic-lines);
            z-index: 0;
            opacity: 0;
            transition: opacity 0.2s;
            pointer-events: none;
        }

        .chapter-card:not(.locked):hover::before {
            opacity: 1;
        }

        /* Left accent bar */
        .chapter-card::after {
            content: '';
            position: absolute;
            left: 0; top: 0; bottom: 0;
            width: 6px;
            background: var(--color-primary);
            border-right: 2px solid var(--nb-border);
        }

        .chapter-card.locked::after {
            background: var(--text-muted);
        }

        .chapter-card.ch-completed::after {
            background: var(--color-success);
        }

        /* ── CHAPTER INNER ── */
        .chapter-inner {
            position: relative;
            z-index: 1;
            padding: 20px 20px 20px 28px;
        }

        /* ── CHAPTER NUM BADGE ── */
        .chapter-num-row {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 8px;
        }

        .chapter-num {
            font-family: var(--font-heading);
            font-size: 0.68rem;
            font-weight: 900;
            letter-spacing: 3px;
            color: var(--text-muted);
            text-transform: uppercase;
        }

        .chapter-type-badge {
            font-family: var(--font-heading);
            font-size: 0.62rem;
            font-weight: 900;
            letter-spacing: 1.5px;
            text-transform: uppercase;
            padding: 2px 8px;
            border: 2px solid var(--nb-border);
            border-radius: 2px;
            box-shadow: 2px 2px 0 var(--nb-border);
        }

        .badge-main {
            background: var(--color-primary);
            color: #fff;
        }

        .badge-side {
            background: var(--color-purple);
            color: #fff;
        }

        .badge-complete {
            background: var(--color-success);
            color: #fff;
        }

        /* ── CHAPTER TITLE ── */
        .chapter-title {
            font-family: var(--font-heading);
            font-size: 1.35rem;
            font-weight: 900;
            color: var(--text-primary);
            letter-spacing: -0.5px;
            margin: 0 0 6px;
            line-height: 1.2;
            -webkit-text-stroke: 0.3px var(--nb-border);
        }

        .chapter-desc {
            font-size: 0.85rem;
            color: var(--text-secondary);
            font-weight: 500;
            line-height: 1.4;
            margin-bottom: 16px;
        }

        /* ── NODE STRIP ── */
        .node-strip {
            display: flex;
            gap: 0;
            flex-wrap: wrap;
        }

        .node-btn {
            display: flex;
            align-items: center;
            gap: 6px;
            background: var(--bg-secondary);
            border: var(--nb-border-width) solid var(--nb-border);
            border-right: none;
            color: var(--text-primary);
            padding: 8px 14px;
            font-family: var(--font-heading);
            font-size: 0.8rem;
            font-weight: 700;
            cursor: pointer;
            transition: transform 0.08s ease, box-shadow 0.08s ease, background 0.1s;
            letter-spacing: 0.3px;
            position: relative;
            text-transform: uppercase;
        }

        .node-btn:first-child {
            border-radius: 4px 0 0 4px;
        }

        .node-btn:last-child {
            border-right: var(--nb-border-width) solid var(--nb-border);
            border-radius: 0 4px 4px 0;
        }

        .node-btn:only-child {
            border-radius: 4px;
            border-right: var(--nb-border-width) solid var(--nb-border);
        }

        .node-btn:not(:disabled):hover {
            background: var(--glass-bg-hover);
            transform: translate(-1px, -1px);
            box-shadow: var(--nb-shadow-sm);
            z-index: 1;
        }

        .node-btn:not(:disabled):active {
            transform: translate(2px, 2px);
            box-shadow: none;
        }

        .node-btn:disabled {
            opacity: 0.35;
            cursor: not-allowed;
        }

        /* Node type indicator dot */
        .node-dot {
            width: 8px;
            height: 8px;
            border: 2px solid var(--nb-border);
            border-radius: 50%;
            flex-shrink: 0;
        }

        .node-btn.dialogue-node .node-dot {
            background: var(--color-secondary);
            border-radius: 50%;
        }

        .node-btn.battle-node .node-dot {
            background: var(--color-primary);
            border-radius: 1px;
            transform: rotate(45deg);
        }

        .node-btn.completed {
            background: #F0FDF4;
            color: var(--color-success);
        }

        .node-btn.completed .node-dot {
            background: var(--color-success);
        }

        /* ── LOCKED CHAPTER ── */
        .chapter-card.locked {
            opacity: 0.55;
        }

        .locked-overlay {
            position: absolute;
            right: 20px;
            top: 50%;
            transform: translateY(-50%);
            font-family: var(--font-heading);
            font-size: 0.75rem;
            font-weight: 900;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 1.5px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 4px;
        }

        .locked-icon-big {
            font-size: 1.8rem;
        }

        /* ── EMPTY STATE ── */
        .empty-state {
            text-align: center;
            padding: 60px 20px;
            border: var(--nb-border-width) solid var(--nb-border);
            background: var(--bg-card);
            border-radius: 4px;
            box-shadow: var(--nb-shadow);
        }

        .empty-state .icon {
            font-size: 3rem;
            margin-bottom: 12px;
        }

        .empty-state p {
            font-family: var(--font-heading);
            font-size: 0.95rem;
            font-weight: 700;
            color: var(--text-muted);
            letter-spacing: 1px;
            text-transform: uppercase;
        }

        /* ── MANGA PANEL DIVIDER between chapter & nodes ── */
        .panel-divider {
            height: 2px;
            background: var(--nb-border);
            margin: 16px 0 14px;
            position: relative;
        }

        .panel-divider::before {
            content: '▶ 節點';
            position: absolute;
            right: 0;
            top: 50%;
            transform: translateY(-50%);
            background: var(--bg-card);
            padding: 0 6px;
            font-family: var(--font-heading);
            font-size: 0.6rem;
            font-weight: 900;
            color: var(--text-muted);
            letter-spacing: 2px;
            text-transform: uppercase;
        }

        /* ── LEGEND ── */
        .legend-row {
            display: flex;
            gap: 16px;
            align-items: center;
            justify-content: flex-end;
            margin-bottom: 16px;
            flex-wrap: wrap;
        }

        .legend-item {
            display: flex;
            align-items: center;
            gap: 6px;
            font-family: var(--font-heading);
            font-size: 0.68rem;
            font-weight: 700;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .legend-dot {
            width: 8px;
            height: 8px;
            border: 2px solid var(--nb-border);
        }

        .legend-dot.dialogue { background: var(--color-secondary); border-radius: 50%; }
        .legend-dot.battle   { background: var(--color-primary); transform: rotate(45deg); border-radius: 1px; }
        .legend-dot.complete { background: var(--color-success); border-radius: 50%; }

        /* ── RESPONSIVE ── */
        @media (max-width: 600px) {
            .manga-title { font-size: 1.8rem; }
            .chapter-title { font-size: 1.1rem; }
            .node-btn { padding: 7px 10px; font-size: 0.72rem; }
            .top-bar { flex-wrap: wrap; justify-content: center; }
        }
    </style>
</head>

<body>
    <div class="story-menu-container">
        <!-- Top Bar -->
        <div class="top-bar">
            <a href="index.html" class="back-btn">← 返回大廳</a>
            <div class="manga-title-block">
                <div class="manga-title">編年史</div>
                <div class="manga-subtitle">Chronicle Mode</div>
            </div>
            <div style="width: 120px;"></div>
        </div>

        <!-- Tab Strip -->
        <div class="tabs">
            <button class="tab-btn active" id="tab-main" onclick="switchTab('main')">📖 主傳</button>
            <button class="tab-btn" id="tab-side" onclick="switchTab('side')">✦ 外傳</button>
        </div>

        <!-- Legend -->
        <div class="legend-row">
            <div class="legend-item">
                <div class="legend-dot dialogue"></div>劇情
            </div>
            <div class="legend-item">
                <div class="legend-dot battle"></div>戰鬥
            </div>
            <div class="legend-item">
                <div class="legend-dot complete"></div>已完成
            </div>
        </div>

        <!-- Chapter List -->
        <div class="chapter-list" id="chapterList"></div>
    </div>

    <!-- Scripts -->
    <script src="js/data/story.js"></script>
    <script>
        let currentTab = 'main';

        function switchTab(tab) {
            currentTab = tab;
            document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
            document.getElementById('tab-' + tab).classList.add('active');
            renderList();
        }

        function renderList() {
            const listEl = document.getElementById('chapterList');
            listEl.innerHTML = '';

            const progress = getStoryProgress();
            const filteredChapters = STORY_CHAPTERS.filter(c => c.type === currentTab);

            if (filteredChapters.length === 0) {
                listEl.innerHTML = `
                    <div class="empty-state">
                        <div class="icon">📚</div>
                        <p>敬請期待...</p>
                    </div>`;
                return;
            }

            filteredChapters.forEach((chapter, ci) => {
                const isChapterUnlocked = progress.unlockedNodes[`${chapter.id}_0`];

                // Check completion
                const allCompleted = chapter.nodes.every((_, i) =>
                    progress.completedNodes[`${chapter.id}_${i}`]
                );

                // Build node buttons
                let nodesHtml = '';
                chapter.nodes.forEach((node, index) => {
                    const nodeId = `${chapter.id}_${index}`;
                    const isUnlocked = progress.unlockedNodes[nodeId];
                    const isCompleted = progress.completedNodes[nodeId];

                    let btnClass = 'node-btn';
                    if (node.type === 'dialogue') btnClass += ' dialogue-node';
                    if (node.type === 'battle')   btnClass += ' battle-node';
                    if (isCompleted)               btnClass += ' completed';

                    const nodeIcon = node.type === 'dialogue' ? '💬' : '⚔';
                    const nodeTitle = node.title ||
                        (node.type === 'dialogue' ? `劇情 ${index + 1}` : `戰鬥 ${index + 1}`);
                    const disabledAttr = (!isUnlocked && !isCompleted) ? 'disabled' : '';

                    nodesHtml += `
                        <button class="${btnClass}" ${disabledAttr}
                                onclick="startNode('${chapter.id}', ${index})">
                            <div class="node-dot"></div>
                            ${nodeIcon} ${nodeTitle}
                        </button>`;
                });

                // Type badge
                const badgeClass = currentTab === 'main' ? 'badge-main' : 'badge-side';
                const badgeLabel = currentTab === 'main' ? '主傳' : '外傳';
                const completeBadge = allCompleted
                    ? `<span class="chapter-type-badge badge-complete">✓ 完成</span>` : '';

                const card = document.createElement('div');
                card.className = `chapter-card${!isChapterUnlocked ? ' locked' : ''}${allCompleted ? ' ch-completed' : ''}`;

                card.innerHTML = `
                    <div class="chapter-inner">
                        <div class="chapter-num-row">
                            <span class="chapter-num">第 ${chapter.chapter_number} 章</span>
                            <span class="chapter-type-badge ${badgeClass}">${badgeLabel}</span>
                            ${completeBadge}
                        </div>
                        <div class="chapter-title">${chapter.title}</div>
                        <div class="chapter-desc">${chapter.description || ''}</div>
                        <div class="panel-divider"></div>
                        <div class="node-strip">
                            ${nodesHtml}
                        </div>
                    </div>
                    ${!isChapterUnlocked ? `
                    <div class="locked-overlay">
                        <span class="locked-icon-big">🔒</span>
                        <span>未解鎖</span>
                    </div>` : ''}`;

                listEl.appendChild(card);
            });
        }

        function startNode(chapterId, nodeIndex) {
            localStorage.setItem('story_current_chapter', chapterId);
            localStorage.setItem('story_current_node', nodeIndex);

            const chapter = STORY_CHAPTERS.find(c => c.id === chapterId);
            const node = chapter.nodes[nodeIndex];

            if (node.type === 'dialogue') {
                location.href = 'story_runner.html';
            } else if (node.type === 'battle') {
                localStorage.setItem('gameMode', 'story');
                location.href = 'game.html';
            }
        }

        // Init
        renderList();
    </script>
</body>

</html>
