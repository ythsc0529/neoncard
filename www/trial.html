<!DOCTYPE html>
<html lang="zh-TW">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>霓虹牌 - 試煉之路 (PATH OF TRIALS)</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700;900&family=Noto+Sans+TC:wght@500;700;900&family=Inter:wght@400;600;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/styles.css">
    
    <!-- Firebase SDK -->
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
    
    <!-- Core & Data -->
    <script src="js/theme.js"></script>
    <script src="js/core/auth.js"></script>
    <script src="js/core/userProfile.js"></script>
    <script src="js/core/rankedSystem.js"></script>
    <script src="js/data/characters_part1.js"></script>
    <script src="js/data/characters_part2.js"></script>
    <script src="js/data/characters_part3.js"></script>
    <script src="js/data/characters_part4.js"></script>
    <script src="js/data/characters_part5.js"></script>
    <script src="js/data/characters_part6.js"></script>
    <script src="js/data/characters.js"></script>
    <script src="js/data/trialData.js"></script>
    <script src="js/ui/soundManager.js"></script>
    <script src="js/core/notificationManager.js"></script>

    <style>
        :root {
            --comic-black: #0A0A0A;
            --comic-yellow: #FFD700;
            --comic-orange: #FF4D1C;
            --comic-blue: #3B82F6;
            --comic-cyan: #00D2FF;
            --comic-green: #10B981;
            --comic-purple: #8B5CF6;
            --comic-pink: #EC4899;
            --comic-paper: #FFFBF0;
            --comic-paper-dark: #F4EEDC;
            --comic-card: #FFFFFF;
            --comic-border: 3px solid #0A0A0A;
            --comic-border-thick: 4px solid #0A0A0A;
            --comic-shadow-sm: 2px 2px 0px #0A0A0A;
            --comic-shadow: 4px 4px 0px #0A0A0A;
            --comic-shadow-lg: 6px 6px 0px #0A0A0A;
            --comic-shadow-xl: 8px 8px 0px #0A0A0A;
        }

        body {
            background-color: var(--comic-paper);
            background-image: radial-gradient(circle, #0A0A0A 1.1px, transparent 1.1px);
            background-size: 18px 18px;
            min-height: 100vh;
            color: var(--comic-black);
            font-family: 'Space Grotesk', 'Noto Sans TC', sans-serif;
            overflow-x: hidden;
            user-select: none;
        }

        /* ── Loading Screen ── */
        #pageLoading {
            position: fixed;
            inset: 0;
            background: var(--comic-paper);
            background-image: radial-gradient(circle, #0A0A0A 1.2px, transparent 1.2px);
            background-size: 20px 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 99999;
        }

        .loading-box {
            background: #FFFFFF;
            border: var(--comic-border-thick);
            box-shadow: var(--comic-shadow-xl);
            padding: 32px 40px;
            text-align: center;
            transform: rotate(-1deg);
            max-width: 90%;
        }

        .loading-title {
            font-size: 2.2rem;
            font-weight: 900;
            letter-spacing: -0.5px;
            color: var(--comic-orange);
            -webkit-text-stroke: 1px #0A0A0A;
            margin-bottom: 12px;
            animation: pulse 1s infinite alternate;
        }

        .loading-bar-wrap {
            width: 240px;
            max-width: 100%;
            height: 16px;
            background: var(--comic-paper-dark);
            border: 3px solid #0A0A0A;
            box-shadow: var(--comic-shadow-sm);
            overflow: hidden;
            margin: 0 auto 12px;
        }

        .loading-bar-fill {
            height: 100%;
            width: 60%;
            background: repeating-linear-gradient(45deg, var(--comic-yellow), var(--comic-yellow) 10px, var(--comic-orange) 10px, var(--comic-orange) 20px);
            animation: comicBarMove 1s linear infinite;
        }

        @keyframes comicBarMove {
            from { background-position: 0 0; }
            to { background-position: 28px 0; }
        }

        /* ── Page Container ── */
        .trial-page {
            max-width: 1120px;
            margin: 0 auto;
            padding: 20px 16px 80px;
        }

        /* ── Header ── */
        .trial-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 14px;
            margin-bottom: 24px;
        }

        .comic-back-btn {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            background: #FFFFFF;
            color: #0A0A0A;
            text-decoration: none;
            font-weight: 900;
            font-size: 0.95rem;
            letter-spacing: 0.5px;
            padding: 10px 18px;
            border: var(--comic-border);
            box-shadow: var(--comic-shadow);
            transition: transform 0.08s ease, box-shadow 0.08s ease, background 0.15s ease;
        }

        .comic-back-btn:hover {
            background: var(--comic-yellow);
            transform: translate(-2px, -2px);
            box-shadow: var(--comic-shadow-lg);
        }

        .comic-back-btn:active {
            transform: translate(3px, 3px);
            box-shadow: none;
        }

        .trial-title-wrap {
            display: flex;
            align-items: center;
            gap: 12px;
            flex-wrap: wrap;
        }

        .page-heading {
            font-size: 1.85rem;
            font-weight: 900;
            color: var(--comic-black);
            text-transform: uppercase;
            letter-spacing: -0.5px;
            margin: 0;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .heading-badge {
            display: inline-block;
            background: var(--comic-orange);
            color: #FFFFFF;
            font-size: 0.75rem;
            font-weight: 900;
            padding: 4px 10px;
            border: 2px solid #0A0A0A;
            box-shadow: var(--comic-shadow-sm);
            text-transform: uppercase;
            letter-spacing: 1px;
            transform: rotate(-2deg);
        }

        .header-actions {
            display: flex;
            align-items: center;
            gap: 10px;
            flex-wrap: wrap;
        }

        /* ── Hero Showcase Section ── */
        .trial-hero-grid {
            display: grid;
            grid-template-columns: 1.15fr 1.15fr 0.9fr;
            gap: 16px;
            margin-bottom: 24px;
        }

        @media (max-width: 1024px) {
            .trial-hero-grid {
                grid-template-columns: 1fr 1fr;
            }
            .hero-card-stats {
                grid-column: span 2;
            }
        }

        @media (max-width: 720px) {
            .trial-hero-grid {
                grid-template-columns: 1fr;
            }
            .hero-card-stats {
                grid-column: span 1;
            }
        }

        .hero-card {
            background: #FFFFFF;
            border: var(--comic-border-thick);
            box-shadow: var(--comic-shadow-lg);
            padding: 20px;
            position: relative;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        .comic-sticker {
            position: absolute;
            top: 10px;
            right: 12px;
            background: var(--comic-yellow);
            color: #0A0A0A;
            border: 2px solid #0A0A0A;
            box-shadow: var(--comic-shadow-sm);
            font-size: 0.72rem;
            font-weight: 900;
            padding: 3px 8px;
            text-transform: uppercase;
            letter-spacing: 1px;
            transform: rotate(3deg);
            z-index: 2;
        }

        .hero-card-title {
            font-size: 1.25rem;
            font-weight: 900;
            color: var(--comic-black);
            margin-bottom: 12px;
            display: flex;
            align-items: center;
            gap: 6px;
            text-transform: uppercase;
        }

        /* Card 1: Player Level & EXP Progress */
        .level-progress-block {
            display: flex;
            align-items: center;
            gap: 16px;
            margin: 8px 0 12px;
            background: var(--comic-paper);
            border: var(--comic-border);
            padding: 12px 14px;
            box-shadow: var(--comic-shadow-sm);
        }

        .level-shield-badge {
            width: 64px;
            height: 64px;
            background: var(--comic-orange);
            border: 3px solid #0A0A0A;
            box-shadow: var(--comic-shadow-sm);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
            color: #FFFFFF;
            transform: rotate(-3deg);
        }

        .level-shield-badge .lv-lbl {
            font-size: 0.65rem;
            font-weight: 900;
            line-height: 1;
            letter-spacing: 1px;
            opacity: 0.9;
        }

        .level-shield-badge .lv-num {
            font-size: 1.9rem;
            font-weight: 900;
            line-height: 1;
        }

        .exp-gauge-container {
            flex: 1;
            min-width: 0;
        }

        .exp-gauge-info {
            display: flex;
            justify-content: space-between;
            align-items: baseline;
            margin-bottom: 6px;
            font-size: 0.82rem;
            font-weight: 900;
        }

        .exp-gauge-info .exp-val {
            color: var(--comic-orange);
            font-size: 0.95rem;
        }

        .comic-gauge-bar {
            width: 100%;
            height: 18px;
            background: #FFFFFF;
            border: 2px solid #0A0A0A;
            box-shadow: 2px 2px 0 #0A0A0A;
            overflow: hidden;
            position: relative;
        }

        .comic-gauge-fill {
            height: 100%;
            width: 0%;
            background: repeating-linear-gradient(45deg, var(--comic-yellow), var(--comic-yellow) 10px, var(--comic-orange) 10px, var(--comic-orange) 20px);
            border-right: 2px solid #0A0A0A;
            transition: width 0.5s cubic-bezier(0.2, 0.8, 0.2, 1);
        }

        .comic-rule-callout {
            background: #FEF3C7;
            border: 2px solid #0A0A0A;
            padding: 8px 10px;
            font-size: 0.75rem;
            font-weight: 700;
            color: #78350F;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        /* Card 2: Grand Milestone Spotlight */
        .hero-card-grand {
            background: linear-gradient(135deg, #FFFDF5 0%, #FEF3C7 100%);
            border: var(--comic-border-thick);
            position: relative;
        }

        .grand-target-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 10px;
        }

        .grand-target-pill {
            background: #0A0A0A;
            color: var(--comic-yellow);
            font-size: 0.72rem;
            font-weight: 900;
            padding: 2px 8px;
            border-radius: 2px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .grand-content-box {
            display: flex;
            align-items: center;
            gap: 14px;
            margin: 6px 0 12px;
        }

        .grand-emblem-wrap {
            width: 68px;
            height: 68px;
            background: var(--comic-yellow);
            border: 3px solid #0A0A0A;
            box-shadow: var(--comic-shadow);
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
            transform: rotate(-2deg);
            position: relative;
            overflow: hidden;
        }

        .grand-emblem-img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .grand-emblem-icon {
            font-size: 2rem;
        }

        .grand-info-wrap {
            flex: 1;
            min-width: 0;
        }

        .grand-level-tag {
            font-size: 0.72rem;
            font-weight: 900;
            color: #92400E;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .grand-title-name {
            font-size: 1.25rem;
            font-weight: 900;
            color: #0A0A0A;
            line-height: 1.2;
            margin: 2px 0 4px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .grand-rewards-preview {
            font-size: 0.78rem;
            color: #4B5563;
            font-weight: 700;
            display: flex;
            align-items: center;
            gap: 6px;
            flex-wrap: wrap;
        }

        .grand-status-bar {
            background: #FFFFFF;
            border: 2px solid #0A0A0A;
            box-shadow: var(--comic-shadow-sm);
            padding: 6px 10px;
            font-size: 0.75rem;
            font-weight: 900;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        /* Card 3: Summary & Quick Claim */
        .hero-card-stats {
            background: #FFFFFF;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        .stats-metrics-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 8px;
            margin: 8px 0 14px;
        }

        .stat-metric-box {
            background: var(--comic-paper);
            border: 2px solid #0A0A0A;
            box-shadow: var(--comic-shadow-sm);
            padding: 8px 10px;
            text-align: center;
        }

        .stat-metric-lbl {
            font-size: 0.68rem;
            font-weight: 900;
            color: #6B7280;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-bottom: 2px;
        }

        .stat-metric-val {
            font-size: 1.3rem;
            font-weight: 900;
            color: #0A0A0A;
            line-height: 1.1;
        }

        .stat-metric-val.highlight {
            color: var(--comic-orange);
        }

        .btn-comic-claim-all {
            width: 100%;
            background: var(--comic-orange);
            color: #FFFFFF;
            border: var(--comic-border);
            box-shadow: var(--comic-shadow);
            padding: 12px 14px;
            font-family: inherit;
            font-size: 0.95rem;
            font-weight: 900;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            transition: transform 0.08s ease, box-shadow 0.08s ease, background 0.15s ease;
        }

        .btn-comic-claim-all:hover:not(:disabled) {
            background: #E03E10;
            transform: translate(-2px, -2px);
            box-shadow: var(--comic-shadow-lg);
        }

        .btn-comic-claim-all:active:not(:disabled) {
            transform: translate(3px, 3px);
            box-shadow: none;
        }

        .btn-comic-claim-all:disabled {
            background: #D1D5DB;
            color: #6B7280;
            cursor: not-allowed;
            box-shadow: 2px 2px 0 #0A0A0A;
            opacity: 0.85;
        }

        .claim-count-pill {
            background: var(--comic-yellow);
            color: #0A0A0A;
            font-size: 0.72rem;
            font-weight: 900;
            padding: 2px 6px;
            border: 1.5px solid #0A0A0A;
            border-radius: 999px;
        }

        /* ── Action & Filter Bar ── */
        .trial-filter-bar {
            background: #FFFFFF;
            border: var(--comic-border-thick);
            box-shadow: var(--comic-shadow);
            padding: 10px 14px;
            margin-bottom: 24px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 10px;
        }

        .filter-tabs-group {
            display: flex;
            align-items: center;
            gap: 8px;
            flex-wrap: wrap;
        }

        .filter-tab-btn {
            background: var(--comic-paper);
            color: #0A0A0A;
            border: 2px solid #0A0A0A;
            box-shadow: var(--comic-shadow-sm);
            padding: 7px 12px;
            font-family: inherit;
            font-size: 0.82rem;
            font-weight: 900;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            transition: transform 0.08s ease, box-shadow 0.08s ease, background 0.15s ease;
        }

        .filter-tab-btn:hover {
            background: var(--comic-yellow);
            transform: translate(-1px, -1px);
            box-shadow: var(--comic-shadow);
        }

        .filter-tab-btn.active {
            background: #0A0A0A;
            color: var(--comic-yellow);
            box-shadow: var(--comic-shadow-sm);
        }

        .filter-badge-num {
            background: var(--comic-orange);
            color: #FFFFFF;
            font-size: 0.68rem;
            font-weight: 900;
            padding: 1px 5px;
            border-radius: 999px;
            border: 1px solid #0A0A0A;
        }

        .filter-tab-btn.active .filter-badge-num {
            background: var(--comic-yellow);
            color: #0A0A0A;
        }

        .btn-comic-jump {
            background: #FFFFFF;
            color: #0A0A0A;
            border: 2px solid #0A0A0A;
            box-shadow: var(--comic-shadow-sm);
            padding: 7px 12px;
            font-family: inherit;
            font-size: 0.82rem;
            font-weight: 900;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            transition: transform 0.08s ease, box-shadow 0.08s ease, background 0.15s ease;
        }

        .btn-comic-jump:hover {
            background: var(--comic-cyan);
            transform: translate(-1px, -1px);
            box-shadow: var(--comic-shadow);
        }

        .btn-comic-jump:active {
            transform: translate(2px, 2px);
            box-shadow: none;
        }

        /* ── Milestone Timeline & Cards ── */
        .milestone-list {
            display: flex;
            flex-direction: column;
            gap: 14px;
            position: relative;
        }

        .milestone-comic-card {
            background: #FFFFFF;
            border: var(--comic-border-thick);
            box-shadow: var(--comic-shadow);
            padding: 16px 20px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 18px;
            transition: transform 0.08s ease, box-shadow 0.08s ease, border-color 0.15s ease;
            position: relative;
            overflow: hidden;
        }

        .milestone-comic-card:hover {
            transform: translate(-2px, -2px);
            box-shadow: var(--comic-shadow-lg);
        }

        /* Card States */
        .milestone-comic-card.state-current {
            border: 4px solid var(--comic-orange);
            background: #FFFDF5;
            box-shadow: var(--comic-shadow-lg);
        }

        .milestone-comic-card.state-unlocked {
            background: #FFFFFF;
        }

        .milestone-comic-card.state-claimed {
            background: var(--comic-paper-dark);
            opacity: 0.82;
            box-shadow: var(--comic-shadow-sm);
        }

        .milestone-comic-card.state-locked {
            background: #FAFAFA;
        }

        /* Status Stickers / Stamps */
        .card-status-sticker {
            position: absolute;
            top: 6px;
            right: 12px;
            font-size: 0.68rem;
            font-weight: 900;
            padding: 2px 7px;
            border: 1.5px solid #0A0A0A;
            box-shadow: 1.5px 1.5px 0 #0A0A0A;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            z-index: 2;
        }

        .sticker-current {
            background: var(--comic-orange);
            color: #FFFFFF;
            transform: rotate(-2deg);
        }

        .sticker-ready {
            background: var(--comic-yellow);
            color: #0A0A0A;
            transform: rotate(2deg);
            animation: pulse 1.2s infinite alternate;
        }

        .sticker-claimed {
            background: #E5E7EB;
            color: #4B5563;
            transform: rotate(1deg);
        }

        /* Milestone Left: Level Badge */
        .milestone-badge-box {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-width: 76px;
            padding: 10px 8px;
            background: var(--comic-paper);
            border: 3px solid #0A0A0A;
            box-shadow: var(--comic-shadow-sm);
            transform: rotate(-2deg);
            flex-shrink: 0;
            text-align: center;
        }

        .state-current .milestone-badge-box {
            background: var(--comic-orange);
            color: #FFFFFF;
        }

        .state-unlocked .milestone-badge-box {
            background: var(--comic-yellow);
        }

        .state-claimed .milestone-badge-box {
            background: #E5E7EB;
            color: #6B7280;
            box-shadow: none;
        }

        .state-locked .milestone-badge-box {
            background: #F3F4F6;
            color: #9CA3AF;
        }

        .milestone-lv-lbl {
            font-size: 0.65rem;
            font-weight: 900;
            line-height: 1;
            letter-spacing: 1px;
            text-transform: uppercase;
        }

        .milestone-lv-num {
            font-size: 1.8rem;
            font-weight: 900;
            line-height: 1.1;
            letter-spacing: -0.5px;
        }

        /* Milestone Center: Rewards Showcase */
        .milestone-rewards-wrap {
            flex: 1;
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            align-items: center;
            min-width: 0;
        }

        .reward-chip {
            background: var(--comic-paper);
            border: 2px solid #0A0A0A;
            box-shadow: var(--comic-shadow-sm);
            padding: 6px 12px;
            font-size: 0.85rem;
            font-family: inherit;
            font-weight: 800;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            letter-spacing: 0.2px;
            transition: transform 0.08s ease;
        }

        .reward-chip:hover {
            transform: translate(-1px, -1px);
        }

        /* Character Chip */
        .c-char {
            background: #FAF5FF;
            color: #6B21A8;
            border-color: #0A0A0A;
        }

        .char-rarity-pill {
            font-size: 0.65rem;
            font-weight: 900;
            padding: 1px 5px;
            border: 1px solid #0A0A0A;
            border-radius: 2px;
            color: #FFFFFF;
        }

        .rarity-mythic { background: #FF0040; }
        .rarity-legendary { background: #F59E0B; color: #0A0A0A; }
        .rarity-epic { background: #8B5CF6; }
        .rarity-rare { background: #00B4D8; color: #0A0A0A; }
        .rarity-common { background: #6B7280; }

        /* Item Chip */
        .c-item {
            color: var(--comic-black);
            background: #FFFFFF;
        }

        .item-icon-inline {
            width: 20px;
            height: 20px;
            vertical-align: middle;
            object-fit: contain;
        }

        .item-count-badge {
            font-size: 0.8rem;
            font-weight: 900;
            color: var(--comic-orange);
        }

        /* Title Chip */
        .c-title {
            background: #FEF3C7;
            color: #92400E;
            border: 2px solid #0A0A0A;
        }

        .title-thumb-img {
            width: 22px;
            height: 22px;
            object-fit: cover;
            border: 1.5px solid #0A0A0A;
            border-radius: 2px;
        }

        /* Special Note Chip */
        .c-note {
            background: #ECFDF5;
            color: #065F46;
            border: 2px dashed #0A0A0A;
        }

        /* Milestone Right: Action Button */
        .milestone-action-box {
            flex-shrink: 0;
            display: flex;
            flex-direction: column;
            align-items: flex-end;
            gap: 4px;
        }

        .btn-comic-claim {
            background: var(--comic-yellow);
            color: #0A0A0A;
            border: var(--comic-border);
            box-shadow: var(--comic-shadow);
            padding: 9px 18px;
            font-family: inherit;
            font-size: 0.9rem;
            font-weight: 900;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            transition: transform 0.08s ease, box-shadow 0.08s ease, background 0.15s ease;
        }

        .btn-comic-claim:hover {
            background: #FBBF24;
            transform: translate(-2px, -2px);
            box-shadow: var(--comic-shadow-lg);
        }

        .btn-comic-claim:active {
            transform: translate(3px, 3px);
            box-shadow: none;
        }

        .btn-comic-completed {
            background: #E5E7EB;
            color: #6B7280;
            border: 2px solid #0A0A0A;
            box-shadow: 2px 2px 0 #0A0A0A;
            padding: 8px 16px;
            font-family: inherit;
            font-size: 0.85rem;
            font-weight: 900;
            cursor: default;
            display: inline-flex;
            align-items: center;
            gap: 4px;
            opacity: 0.8;
        }

        .btn-comic-locked {
            background: #F3F4F6;
            color: #9CA3AF;
            border: 2px dashed #9CA3AF;
            padding: 8px 16px;
            font-family: inherit;
            font-size: 0.85rem;
            font-weight: 900;
            cursor: default;
            display: inline-flex;
            align-items: center;
            gap: 6px;
        }

        /* ── Comic Custom Modal (Celebration / Claim Summary) ── */
        .comic-modal-overlay {
            position: fixed;
            inset: 0;
            background: rgba(10, 10, 10, 0.7);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 9999;
            padding: 16px;
            backdrop-filter: blur(2px);
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.2s ease;
        }

        .comic-modal-overlay.show {
            opacity: 1;
            pointer-events: auto;
        }

        .comic-modal-box {
            background: #FFFFFF;
            border: var(--comic-border-thick);
            box-shadow: var(--comic-shadow-xl);
            width: 100%;
            max-width: 480px;
            padding: 26px 24px;
            position: relative;
            transform: scale(0.95) rotate(-0.5deg);
            transition: transform 0.2s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        .comic-modal-overlay.show .comic-modal-box {
            transform: scale(1) rotate(-0.5deg);
        }

        .comic-modal-banner {
            background: var(--comic-orange);
            color: #FFFFFF;
            border: 3px solid #0A0A0A;
            box-shadow: var(--comic-shadow-sm);
            padding: 8px 14px;
            font-size: 1.35rem;
            font-weight: 900;
            text-align: center;
            letter-spacing: -0.5px;
            text-transform: uppercase;
            margin: -10px -10px 16px;
            transform: rotate(-1deg);
        }

        .comic-modal-body {
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin-bottom: 20px;
            max-height: 60vh;
            overflow-y: auto;
            padding-right: 4px;
        }

        .claim-summary-group {
            background: var(--comic-paper);
            border: 2px solid #0A0A0A;
            box-shadow: var(--comic-shadow-sm);
            padding: 10px 12px;
        }

        .claim-group-title {
            font-size: 0.75rem;
            font-weight: 900;
            color: #6B7280;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-bottom: 6px;
            display: flex;
            align-items: center;
            gap: 4px;
        }

        .claim-items-chips {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
        }

        .dupe-coin-callout {
            background: #FEF3C7;
            border: 2px solid #0A0A0A;
            padding: 8px 10px;
            font-size: 0.82rem;
            font-weight: 800;
            color: #92400E;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .btn-comic-confirm {
            width: 100%;
            background: var(--comic-yellow);
            color: #0A0A0A;
            border: var(--comic-border);
            box-shadow: var(--comic-shadow);
            padding: 12px;
            font-family: inherit;
            font-size: 1rem;
            font-weight: 900;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            cursor: pointer;
            transition: transform 0.08s ease, box-shadow 0.08s ease, background 0.15s ease;
        }

        .btn-comic-confirm:hover {
            background: #FBBF24;
            transform: translate(-2px, -2px);
            box-shadow: var(--comic-shadow-lg);
        }

        .btn-comic-confirm:active {
            transform: translate(3px, 3px);
            box-shadow: none;
        }

        /* ── Responsive Adjustments ── */
        @media (max-width: 680px) {
            .milestone-comic-card {
                flex-direction: column;
                align-items: stretch;
                text-align: left;
                gap: 14px;
                padding-top: 28px;
            }
            .milestone-badge-box {
                align-self: flex-start;
            }
            .milestone-action-box {
                align-items: stretch;
            }
            .btn-comic-claim, .btn-comic-completed, .btn-comic-locked {
                width: 100%;
                justify-content: center;
            }
            .trial-filter-bar {
                flex-direction: column;
                align-items: stretch;
            }
            .filter-tabs-group {
                justify-content: flex-start;
                overflow-x: auto;
                padding-bottom: 4px;
            }
            .btn-comic-jump {
                width: 100%;
                justify-content: center;
            }
        }
    </style>
</head>

<body>
    <!-- Loading Screen -->
    <div id="pageLoading">
        <div class="loading-box">
            <div class="loading-title">⚔️ 試煉之路</div>
            <div class="loading-bar-wrap">
                <div class="loading-bar-fill"></div>
            </div>
            <div style="font-size:0.75rem; color:#6B7280; text-transform:uppercase; letter-spacing:2px; font-weight:900;">LOADING TACTICAL DATA...</div>
        </div>
    </div>

    <!-- Main Container -->
    <div class="trial-page" id="trialPage" style="display:none;">
        
        <!-- Header -->
        <header class="trial-header">
            <a href="profile.html" class="comic-back-btn">← 返回個人檔案</a>
            
            <div class="trial-title-wrap">
                <h1 class="page-heading">⚔️ 試煉之路</h1>
                <span class="heading-badge">PATH OF TRIALS</span>
            </div>

            <div class="header-actions">
                <button class="btn-comic-jump" onclick="scrollToCurrentLevel()">
                    📍 跳至當前進度
                </button>
            </div>
        </header>

        <!-- Hero Showcase Grid -->
        <section class="trial-hero-grid">
            
            <!-- Card 1: Player Level & EXP Gauge -->
            <div class="hero-card">
                <span class="comic-sticker">STATUS</span>
                <div class="hero-card-title">🎖️ 等級進度儀表</div>
                
                <div class="level-progress-block">
                    <div class="level-shield-badge">
                        <span class="lv-lbl">LEVEL</span>
                        <span id="displayLevel" class="lv-num">0</span>
                    </div>
                    <div class="exp-gauge-container">
                        <div class="exp-gauge-info">
                            <span>EXP 成長經驗</span>
                            <span id="displayExp" class="exp-val">0 / 50</span>
                        </div>
                        <div class="comic-gauge-bar">
                            <div class="comic-gauge-fill" id="expFill"></div>
                        </div>
                    </div>
                </div>

                <div class="comic-rule-callout">
                    <span>💡</span>
                    <span>每場天梯排位與對戰皆可累積經驗值提升階級！</span>
                </div>
            </div>

            <!-- Card 2: Next Grand Milestone -->
            <div class="hero-card hero-card-grand">
                <span class="comic-sticker">NEXT TARGET</span>
                
                <div class="grand-target-header">
                    <div class="hero-card-title" style="margin-bottom:0;">⚡ 下一重大里程碑</div>
                    <span class="grand-target-pill" id="nextMilestoneDiff">-- 級達成</span>
                </div>

                <div class="grand-content-box">
                    <div class="grand-emblem-wrap" id="grandEmblemBox">
                        <span class="grand-emblem-icon">🏆</span>
                    </div>
                    <div class="grand-info-wrap">
                        <div class="grand-level-tag" id="grandLevelTag">Lv.-- 里程碑</div>
                        <div class="grand-title-name" id="grandTitleName">真理學徒</div>
                        <div class="grand-rewards-preview" id="grandRewardsPreview">
                            <span>載入中...</span>
                        </div>
                    </div>
                </div>

                <div class="grand-status-bar">
                    <span>🎯 解鎖目標</span>
                    <span id="grandProgressNote" style="color:var(--comic-orange);">持續戰鬥以解鎖</span>
                </div>
            </div>

            <!-- Card 3: Milestone Summary & Quick Claim -->
            <div class="hero-card hero-card-stats">
                <span class="comic-sticker">REWARD DATA</span>
                <div class="hero-card-title">📦 獎勵總覽</div>

                <div class="stats-metrics-grid">
                    <div class="stat-metric-box">
                        <div class="stat-metric-lbl">已領取階段</div>
                        <div class="stat-metric-val" id="statClaimedRatio">0 / 28</div>
                    </div>
                    <div class="stat-metric-box">
                        <div class="stat-metric-lbl">待領取獎勵</div>
                        <div class="stat-metric-val highlight" id="statPendingCount">0</div>
                    </div>
                </div>

                <button class="btn-comic-claim-all" id="btnClaimAll" onclick="claimAllEligible()" disabled>
                    <span>🎁 一鍵領取全部獎勵</span>
                    <span class="claim-count-pill" id="claimAllCountBadge">0</span>
                </button>
            </div>

        </section>

        <!-- Filter & Control Bar -->
        <section class="trial-filter-bar">
            <div class="filter-tabs-group">
                <button class="filter-tab-btn active" data-filter="all" onclick="setFilter('all', this)">
                    🌟 全部里程碑
                </button>
                <button class="filter-tab-btn" data-filter="claimable" onclick="setFilter('claimable', this)">
                    💥 可領取 <span class="filter-badge-num" id="filterClaimableBadge" style="display:none;">0</span>
                </button>
                <button class="filter-tab-btn" data-filter="special" onclick="setFilter('special', this)">
                    🎖️ 含稱號 / 特殊
                </button>
                <button class="filter-tab-btn" data-filter="locked" onclick="setFilter('locked', this)">
                    🔒 未解鎖
                </button>
            </div>

            <button class="btn-comic-jump" onclick="scrollToCurrentLevel()">
                📍 聚焦當前等級
            </button>
        </section>

        <!-- Milestone Road List -->
        <section class="milestone-list" id="milestones">
            <!-- Dynamic Injection via trial.js -->
        </section>

    </div>

    <!-- Celebration / Claim Modal -->
    <div class="comic-modal-overlay" id="rewardModal">
        <div class="comic-modal-box">
            <div class="comic-modal-banner">💥 獎勵領取成功！</div>
            <div class="comic-modal-body" id="rewardModalBody">
                <!-- Injected via trial.js -->
            </div>
            <button class="btn-comic-confirm" onclick="closeRewardModal()">
                太棒了！確定收下 (CONFIRM)
            </button>
        </div>
    </div>

    <script src="js/ui/trial.js"></script>
</body>

</html>
