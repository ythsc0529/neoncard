<!DOCTYPE html>
<html lang="zh-TW">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>霓虹牌 - 通行證</title>
    <link rel="stylesheet" href="css/styles.css">
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
    <script src="js/theme.js"></script>
    <script src="js/core/auth.js"></script>
    <script src="js/core/userProfile.js"></script>
    <script src="js/data/passData.js"></script>
    <script src="js/ui/soundManager.js"></script>
    <script src="js/core/notificationManager.js"></script>
    <style>
        body {
            background-color: var(--bg-dark);
            background-image: var(--comic-halftone);
            background-size: 20px 20px;
            min-height: 100vh;
            color: var(--text-primary);
        }

        .pass-page {
            max-width: 960px;
            margin: 0 auto;
            padding: 28px 20px 40px;
        }

        /* ── Header ── */
        .header-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 28px;
        }

        .back-btn {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            color: var(--text-primary);
            text-decoration: none;
            font-family: var(--font-heading);
            font-weight: 700;
            font-size: 0.9rem;
            letter-spacing: 1px;
            text-transform: uppercase;
            border: var(--nb-border-width) solid var(--nb-border);
            border-radius: 4px;
            padding: 8px 16px;
            background: var(--bg-card);
            box-shadow: var(--nb-shadow-sm);
            transition: transform 0.08s ease, box-shadow 0.08s ease;
        }

        .back-btn:hover {
            transform: translate(-2px, -2px);
            box-shadow: var(--nb-shadow);
        }

        .back-btn:active {
            transform: translate(3px, 3px);
            box-shadow: none;
        }

        .season-badge {
            background: var(--color-cta);
            border: var(--nb-border-width) solid var(--nb-border);
            border-radius: 4px;
            padding: 6px 14px;
            font-family: var(--font-heading);
            font-size: 0.78rem;
            font-weight: 900;
            color: var(--nb-border);
            text-transform: uppercase;
            letter-spacing: 1.5px;
            box-shadow: var(--nb-shadow-sm);
        }

        /* ── Pass Overview Banner ── */
        .pass-overview {
            background: var(--bg-card);
            border: var(--nb-border-width) solid var(--nb-border);
            border-radius: 4px;
            padding: 28px 32px;
            margin-bottom: 32px;
            display: flex;
            align-items: center;
            gap: 24px;
            box-shadow: var(--nb-shadow-lg);
            position: relative;
            overflow: hidden;
        }

        /* Comic accent stripe */
        .pass-overview::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 8px;
            height: 100%;
            background: var(--color-primary);
            border-right: var(--nb-border-width) solid var(--nb-border);
        }

        .pass-overview-left {
            flex: 1;
            padding-left: 12px;
        }

        .pass-overview-right {
            text-align: right;
            display: flex;
            flex-direction: column;
            align-items: flex-end;
            gap: 12px;
            flex-shrink: 0;
        }

        .pass-title {
            font-family: var(--font-heading);
            font-size: 2.2rem;
            font-weight: 900;
            color: var(--text-primary);
            letter-spacing: -1px;
            margin-bottom: 4px;
            -webkit-text-stroke: 1px var(--nb-border);
        }

        .pass-title span {
            color: var(--color-primary);
        }

        .pass-subtitle {
            font-size: 0.85rem;
            color: var(--text-secondary);
            margin-bottom: 18px;
            font-weight: 500;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        /* ── Progress Bar ── */
        .pass-progress {
            display: flex;
            align-items: center;
            gap: 14px;
        }

        .pass-level-badge {
            width: 52px;
            height: 52px;
            background: var(--color-primary);
            border: var(--nb-border-width) solid var(--nb-border);
            border-radius: 4px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: var(--font-heading);
            font-size: 1.5rem;
            font-weight: 900;
            color: #FFFFFF;
            box-shadow: var(--nb-shadow-sm);
            flex-shrink: 0;
        }

        .progress-bar {
            flex: 1;
            height: 14px;
            background: var(--bg-secondary);
            border: var(--nb-border-width) solid var(--nb-border);
            border-radius: 4px;
            overflow: hidden;
            box-shadow: var(--nb-shadow-sm);
        }

        .progress-fill {
            height: 100%;
            background: var(--color-primary);
            width: 0%;
            transition: width 0.5s cubic-bezier(0.2, 0.8, 0.2, 1);
            border-right: 2px solid var(--nb-border);
        }

        .progress-label {
            font-size: 0.85rem;
            font-weight: 700;
            color: var(--text-secondary);
            white-space: nowrap;
            font-family: var(--font-heading);
        }

        /* ── Premium Status ── */
        .premium-badge {
            background: var(--color-cta);
            border: var(--nb-border-width) solid var(--nb-border);
            border-radius: 4px;
            padding: 6px 14px;
            font-family: var(--font-heading);
            font-size: 0.78rem;
            font-weight: 900;
            color: var(--nb-border);
            text-transform: uppercase;
            letter-spacing: 1.5px;
            box-shadow: var(--nb-shadow-sm);
        }

        .free-badge {
            background: var(--bg-secondary);
            border: var(--nb-border-width) solid var(--nb-border);
            border-radius: 4px;
            padding: 6px 14px;
            font-family: var(--font-heading);
            font-size: 0.78rem;
            font-weight: 900;
            color: var(--text-secondary);
            text-transform: uppercase;
            letter-spacing: 1.5px;
        }

        /* ── Track Container ── */
        .pass-track-section {
            background: var(--bg-card);
            border: var(--nb-border-width) solid var(--nb-border);
            border-radius: 4px;
            box-shadow: var(--nb-shadow);
            overflow: hidden;
        }

        .track-header {
            display: grid;
            grid-template-columns: 110px 1fr;
            border-bottom: var(--nb-border-width) solid var(--nb-border);
        }

        .track-header-label {
            padding: 12px 16px;
            border-right: var(--nb-border-width) solid var(--nb-border);
        }

        .track-header-scroll {
            overflow-x: auto;
        }

        .track-content {
            display: grid;
            grid-template-columns: 110px 1fr;
        }

        .track-labels {
            display: flex;
            flex-direction: column;
            border-right: var(--nb-border-width) solid var(--nb-border);
        }

        .track-label {
            height: 130px;
            display: flex;
            align-items: center;
            justify-content: flex-end;
            padding: 0 16px;
            text-align: right;
            font-family: var(--font-heading);
            font-size: 0.95rem;
            font-weight: 900;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            border-bottom: var(--nb-border-width) solid var(--nb-border);
        }

        .track-label:last-child {
            border-bottom: none;
        }

        .label-premium {
            color: var(--nb-border);
            background: var(--color-cta);
        }

        .label-free {
            color: var(--text-primary);
            background: var(--bg-secondary);
        }

        .track-scroll {
            overflow-x: auto;
            padding: 0;
        }

        .track-levels {
            display: flex;
            gap: 0;
            padding: 0;
        }

        /* ── Level Column ── */
        .level-column {
            display: flex;
            flex-direction: column;
            align-items: center;
            position: relative;
            border-right: 2px solid var(--bg-secondary);
        }

        .level-column:last-child {
            border-right: none;
        }

        .level-num {
            width: 100%;
            height: 32px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: var(--font-heading);
            font-size: 0.75rem;
            font-weight: 900;
            color: var(--text-muted);
            background: var(--bg-secondary);
            border-bottom: var(--nb-border-width) solid var(--nb-border);
            text-transform: uppercase;
        }

        .level-num.unlocked-num {
            background: var(--color-primary);
            color: #FFFFFF;
        }

        /* Level indicator injected by pass.js */
        .level-indicator {
            width: 110px;
            height: 32px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: var(--font-heading);
            font-size: 0.78rem;
            font-weight: 900;
            color: var(--text-muted);
            background: var(--bg-secondary);
            border-top: 2px solid var(--nb-border);
            border-bottom: 2px solid var(--nb-border);
            flex-shrink: 0;
        }

        /* ── Reward Box ── */
        .reward-box {
            width: 110px;
            height: 130px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 10px 8px;
            position: relative;
            cursor: pointer;
            transition: transform 0.08s ease, background 0.15s ease;
            border-bottom: 2px solid var(--bg-secondary);
        }

        .reward-box:hover {
            background: var(--glass-bg-hover);
        }

        .reward-box.premium {
            background: #FFFBEB;
        }

        .reward-box.unlocked {
            background: #F0FDF4;
        }

        .reward-box.unlocked::after {
            content: '可領取';
            position: absolute;
            top: 6px;
            right: 6px;
            background: var(--color-success);
            color: #FFFFFF;
            font-family: var(--font-heading);
            font-size: 0.55rem;
            font-weight: 900;
            padding: 2px 5px;
            border-radius: 2px;
            border: 1px solid var(--nb-border);
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .reward-box.claimed {
            opacity: 0.4;
        }

        .reward-box.locked-premium {
            background: #FFF1F2;
            opacity: 0.7;
        }

        .locked-icon {
            position: absolute;
            top: 6px;
            right: 6px;
            font-size: 0.75rem;
            opacity: 0.6;
        }

        .r-icon {
            font-size: 2rem;
            margin-bottom: 6px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .r-name {
            font-size: 0.7rem;
            color: var(--text-secondary);
            line-height: 1.2;
            font-weight: 600;
        }

        .reward-icon-img {
            width: 48px;
            height: 48px;
            object-fit: contain;
        }

        .item-icon-inline {
            width: 18px;
            height: 18px;
            vertical-align: middle;
            object-fit: contain;
            margin-right: 4px;
        }

        /* ── Scrollbar ── */
        .track-scroll::-webkit-scrollbar { height: 6px; }
        .track-scroll::-webkit-scrollbar-track { background: var(--bg-secondary); }
        .track-scroll::-webkit-scrollbar-thumb {
            background: var(--nb-border);
            border-radius: 0;
        }
    </style>
</head>

<body>
    <div id="pageLoading" style="position:fixed;inset:0;background:var(--bg-dark);background-image:var(--comic-halftone);background-size:20px 20px;display:flex;align-items:center;justify-content:center;z-index:9999;">
        <div style="text-align:center;">
            <div style="font-family:var(--font-heading);font-size:2rem;font-weight:900;color:var(--text-primary);-webkit-text-stroke:1px var(--nb-border);margin-bottom:16px;animation:pulse 1.5s infinite;">霓虹牌</div>
            <div style="width:200px;height:12px;background:var(--bg-secondary);border:var(--nb-border-width) solid var(--nb-border);border-radius:4px;overflow:hidden;box-shadow:var(--nb-shadow-sm);margin:0 auto;">
                <div style="height:100%;width:60%;background:var(--color-primary);animation:pulse 1s infinite;border-right:2px solid var(--nb-border);"></div>
            </div>
            <div style="font-family:var(--font-heading);font-size:0.75rem;color:var(--text-muted);text-transform:uppercase;letter-spacing:2px;font-weight:700;margin-top:10px;">LOADING...</div>
        </div>
    </div>

    <div class="pass-page" id="passPage" style="display:none;">
        <div class="header-row">
            <a href="index.html" class="back-btn">← 返回大廳</a>
            <div class="season-badge">賽季結束：2026/08/31</div>
        </div>

        <!-- Pass Overview -->
        <div class="pass-overview">
            <div class="pass-overview-left">
                <div class="pass-title">踢飛<span>．盛宴</span></div>
                <div class="pass-subtitle">踢飛．起步 (免費) / 踢飛．盛宴 (進階)</div>
                <div class="pass-progress">
                    <div class="pass-level-badge" id="displayLevel">0</div>
                    <div class="progress-bar">
                        <div class="progress-fill" id="expFill"></div>
                    </div>
                    <div class="progress-label" id="displayExp">0 / 50 積分</div>
                </div>
            </div>
            <div class="pass-overview-right">
                <div id="premiumStatus"></div>
                <button class="btn btn-gold" id="btnUnlock" style="display:none;" onclick="unlockPremium()">
                    解鎖進階通行證 (需1 <img src="item_pic/通行證兌換券.png" class="item-icon-inline">)
                </button>
            </div>
        </div>

        <!-- Pass Track -->
        <div class="pass-track-section">
            <!-- Column headers (level numbers) rendered in track-levels -->
            <div style="display:grid;grid-template-columns:110px 1fr;">
                <!-- Left label header -->
                <div style="border-right:var(--nb-border-width) solid var(--nb-border);border-bottom:var(--nb-border-width) solid var(--nb-border);background:var(--bg-secondary);padding:10px 16px;font-family:var(--font-heading);font-size:0.72rem;font-weight:900;color:var(--text-muted);text-transform:uppercase;letter-spacing:1px;display:flex;align-items:center;justify-content:flex-end;">獎勵軌道</div>
                <!-- Scrollable level numbers -->
                <div class="track-scroll" id="levelNumRow" style="border-bottom:var(--nb-border-width) solid var(--nb-border);background:var(--bg-secondary);">
                    <div style="display:flex;" id="levelNumContainer"></div>
                </div>
            </div>
            <div style="display:grid;grid-template-columns:110px 1fr;">
                <!-- Row labels -->
                <div class="track-labels">
                    <div class="track-label label-premium">進階<br><span style="font-size:0.65rem;font-weight:400;text-transform:none;opacity:0.7;">盛宴獎勵</span></div>
                    <div class="track-label label-free">免費<br><span style="font-size:0.65rem;font-weight:400;text-transform:none;opacity:0.7;">起步獎勵</span></div>
                </div>
                <!-- Reward boxes -->
                <div class="track-scroll">
                    <div class="track-levels" id="trackLevels">
                        <!-- Injected via JS -->
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="js/ui/pass.js"></script>
</body>
</html>
