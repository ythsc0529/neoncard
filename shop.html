<!DOCTYPE html>
<html lang="zh-TW">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>霓虹牌 - 商店與抽獎</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Noto+Sans+TC:wght@300;400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/styles.css">
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
    <script src="js/theme.js"></script>
    <script src="js/core/auth.js"></script>
    <script src="js/core/userProfile.js"></script>
    <script src="js/data/missionData.js"></script>
    <script src="js/data/passData.js"></script>
    <script src="js/data/trialData.js"></script>
    <script src="js/data/gachaData.js"></script>
    <script src="js/ui/soundManager.js"></script>
    <script src="js/core/notificationManager.js"></script>
    <script src="js/data/characters_part1.js"></script>
    <script src="js/data/characters_part2.js"></script>
    <script src="js/data/characters_part3.js"></script>
    <script src="js/data/characters_part4.js"></script>
    <script src="js/data/characters_part5.js"></script>
    <script src="js/data/characters_part6.js"></script>
    <script src="js/data/characters.js"></script>
    <script src="js/ui/shop.js" defer></script>
    <style>
        body {
            background-color: var(--bg-secondary);
            background-image: var(--comic-halftone);
            background-size: 20px 20px;
            min-height: 100vh;
            color: var(--text-primary);
        }

        .shop-page {
            max-width: 1100px;
            margin: 0 auto;
            padding: 20px;
        }

        .header-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 24px;
        }

        .back-btn {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            color: var(--text-primary);
            text-decoration: none;
            font-family: var(--font-heading);
            font-weight: 700;
            letter-spacing: 1px;
            text-transform: uppercase;
            transition: transform 0.08s ease;
        }

        .back-btn:hover {
            color: var(--color-primary);
            transform: translateX(-3px);
        }

        .currency-bar {
            display: flex;
            gap: 12px;
            background: var(--bg-card);
            border: var(--nb-border-width) solid var(--nb-border);
            border-radius: 4px;
            padding: 8px 14px;
            box-shadow: var(--nb-shadow-sm);
        }

        .currency-item {
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 0.9rem;
            font-family: var(--font-heading);
            font-weight: 700;
            color: var(--text-primary);
        }

        .item-icon-inline {
            width: 20px;
            height: 20px;
            vertical-align: middle;
            object-fit: contain;
        }

        .shop-item-icon-container {
            height: 100px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 15px;
        }

        .shop-item-img {
            max-height: 100px;
            max-width: 100%;
            transition: transform 0.3s;
        }

        .shop-item:hover .shop-item-img {
            transform: scale(1.1);
        }
        
        .c-money { color: #92400E; font-weight: 900; }
        .c-deed  { color: #C2410C; font-weight: 900; }
        .c-t1    { color: var(--text-secondary); font-weight: 700; }
        .c-t2    { color: #1D4ED8; font-weight: 900; }
        .c-t3    { color: #7E22CE; font-weight: 900; }

        /* Bundle Specific Styles */
        .shop-item.purchased {
            filter: grayscale(0.5);
            opacity: 0.8;
            pointer-events: none;
        }

        .shop-item-tag {
            position: absolute;
            top: 10px;
            left: 10px;
            padding: 3px 8px;
            border-radius: 4px;
            font-size: 0.65rem;
            font-weight: bold;
            text-transform: uppercase;
            letter-spacing: 1px;
            z-index: 10;
        }
        .shop-item-tag.bundle {
            background: var(--color-purple);
            color: white;
            border: 2px solid var(--nb-border);
        }
        .shop-item-tag.item {
            background: var(--bg-secondary);
            color: var(--text-secondary);
            border: 2px solid var(--nb-border);
        }

        .bundle-details {
            margin: 10px 0;
            padding: 8px;
            background: var(--bg-secondary);
            border-radius: 4px;
            border: 2px solid var(--nb-border);
        }

        .bundle-item-chip {
            background: var(--bg-card);
            padding: 2px 6px;
            border-radius: 2px;
            font-size: 0.7rem;
            color: var(--text-primary);
            border: 2px solid var(--nb-border);
            white-space: nowrap;
            font-weight: 700;
        }

        .shop-item-limit {
            font-size: 0.75rem;
            color: var(--text-muted);
            margin-bottom: 8px;
            background: rgba(0,0,0,0.3);
            display: inline-block;
            padding: 2px 8px;
            border-radius: 10px;
        }

        .shop-item.purchased .btn-buy {
            display: none;
        }

        .tabs {
            display: flex;
            gap: 0;
            margin-bottom: 24px;
            border-bottom: var(--nb-border-width) solid var(--nb-border);
        }

        .tab-btn {
            padding: 12px 24px;
            background: var(--bg-secondary);
            border: var(--nb-border-width) solid var(--nb-border);
            border-bottom: none;
            color: var(--text-muted);
            font-family: var(--font-heading);
            font-size: 1rem;
            font-weight: 700;
            cursor: pointer;
            transition: transform 0.08s ease;
            position: relative;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-right: -3px;
        }

        .tab-btn::after { display: none; }

        .tab-btn.active {
            color: var(--nb-border);
            background: var(--color-cta);
            z-index: 1;
        }

        .tab-content {
            display: none;
        }

        .tab-content.active {
            display: block;
            animation: fadeIn 0.3s ease;
        }

        /* Shop Grid */
        .shop-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
            gap: 20px;
        }

        .shop-item {
            background: var(--bg-card);
            border: var(--nb-border-width) solid var(--nb-border);
            border-radius: 4px;
            padding: 20px;
            text-align: center;
            transition: transform 0.08s ease, box-shadow 0.08s ease;
            position: relative;
            overflow: hidden;
            box-shadow: var(--nb-shadow);
        }

        .shop-item:hover {
            border-color: var(--color-primary);
            transform: translate(-3px, -3px);
            box-shadow: var(--nb-shadow-lg);
        }

        .shop-item:active {
            transform: translate(4px, 4px);
            box-shadow: none;
        }

        .shop-item-title {
            font-family: var(--font-heading);
            font-size: 1.2rem;
            font-weight: 900;
            margin-bottom: 10px;
            color: var(--text-primary);
            text-transform: uppercase;
            letter-spacing: -0.5px;
        }

        .shop-item-desc {
            font-size: 0.85rem;
            color: var(--text-secondary);
            margin-bottom: 14px;
            min-height: 40px;
            font-weight: 500;
        }

        .shop-item-limit {
            font-size: 0.75rem;
            color: var(--neon-pink);
            margin-bottom: 10px;
        }

        .btn-buy {
            width: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            font-size: 1rem;
            padding: 10px;
        }

        /* Gacha Pools Layout */
        .gacha-container {
            display: grid;
            grid-template-columns: 260px 1fr;
            gap: 24px;
        }

        @media (max-width: 768px) {
            .gacha-container {
                grid-template-columns: 1fr;
            }
        }

        .pool-list {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .pool-btn {
            background: var(--bg-card);
            border: var(--nb-border-width) solid var(--nb-border);
            border-radius: 4px;
            padding: 14px;
            text-align: left;
            cursor: pointer;
            transition: transform 0.08s ease, box-shadow 0.08s ease;
            display: flex;
            flex-direction: column;
            box-shadow: var(--nb-shadow-sm);
        }

        .pool-btn:hover {
            border-color: var(--color-primary);
            transform: translate(-2px, -2px);
            box-shadow: var(--nb-shadow);
            background: #FFF0E8;
        }

        .pool-btn.active {
            border-color: var(--color-primary);
            background: #FFF0E8;
            box-shadow: var(--nb-shadow);
        }

        .pool-title {
            font-family: var(--font-heading);
            font-size: 1.05rem;
            font-weight: 900;
            color: var(--text-primary);
            margin-bottom: 4px;
            text-transform: uppercase;
        }

        .pool-subtitle {
            font-size: 0.78rem;
            color: var(--text-muted);
            font-weight: 600;
        }

        .gacha-display {
            background: var(--bg-card);
            border: var(--nb-border-width) solid var(--nb-border);
            border-radius: 4px;
            padding: 28px;
            display: flex;
            flex-direction: column;
            align-items: center;
            position: relative;
            box-shadow: var(--nb-shadow-lg);
        }

        .gacha-banner {
            width: 100%;
            height: 180px;
            border-radius: 4px;
            background: var(--bg-secondary);
            border: var(--nb-border-width) solid var(--nb-border);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 2rem;
            margin-bottom: 20px;
            box-shadow: var(--nb-shadow-sm);
        }

        .gacha-rates {
            width: 100%;
            margin-bottom: 0;
            font-size: 0.85rem;
            line-height: 1.5;
            color: var(--text-secondary);
            background: var(--bg-secondary);
            padding: 14px;
            border-top-left-radius: 4px;
            border-top-right-radius: 4px;
            border: var(--nb-border-width) solid var(--nb-border);
            border-bottom: none;
            font-weight: 600;
        }

        .gacha-content-list {
            width: 100%;
            height: 180px;
            background: var(--bg-card);
            border-bottom-left-radius: 4px;
            border-bottom-right-radius: 4px;
            padding: 14px;
            margin-bottom: 20px;
            overflow-y: auto;
            display: flex;
            flex-wrap: wrap;
            align-content: flex-start;
            gap: 8px;
            scrollbar-width: thin;
            scrollbar-color: var(--nb-border) var(--bg-secondary);
            border: var(--nb-border-width) solid var(--nb-border);
            border-top: none;
        }

        .content-chip {
            background: var(--bg-secondary);
            border: 2px solid var(--nb-border);
            border-radius: 2px;
            padding: 4px 10px;
            font-size: 0.75rem;
            color: var(--text-secondary);
            display: flex;
            align-items: center;
            gap: 4px;
            font-weight: 700;
        }

        .content-chip[data-rarity="MYTHIC"]    { border-color: #9F1239; color: #9F1239; background: #FFF1F2; }
        .content-chip[data-rarity="LEGENDARY"] { border-color: #92400E; color: #92400E; background: #FFFBEB; }
        .content-chip[data-rarity="EPIC"]      { border-color: #7E22CE; color: #7E22CE; background: #FAF5FF; }
        .content-chip[data-rarity="RARE"]      { border-color: #1D4ED8; color: #1D4ED8; background: #EFF6FF; }
        .content-chip[data-rarity="COMMON"]    { border-color: #6B7280; color: #6B7280; background: #F9FAFB; }
        .content-chip[data-rarity="SPECIAL"]   { border-color: #166534; color: #166534; background: #F0FDF4; }

        .gacha-actions {
            display: flex;
            gap: 20px;
            width: 100%;
            justify-content: center;
        }

        .btn-pull {
            padding: 14px 36px;
            font-size: 1.1rem;
            font-weight: 900;
            font-family: var(--font-heading);
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 4px;
            min-width: 180px;
            background: var(--color-primary);
            color: #FFFFFF;
            border: var(--nb-border-width) solid var(--nb-border);
            border-radius: 4px;
            cursor: pointer;
            transition: transform 0.08s ease, box-shadow 0.08s ease;
            box-shadow: var(--nb-shadow);
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .btn-pull:hover {
            background: #E63A0F;
            transform: translate(-2px, -2px);
            box-shadow: var(--nb-shadow-lg);
        }

        .btn-pull:active {
            transform: translate(4px, 4px);
            box-shadow: none;
        }

        .btn-pull .cost {
            font-size: 0.85rem;
            opacity: 0.8;
            font-family: var(--font-main);
        }

        /* ══════════════════════════════════════════════════════════════
           GACHA ANIMATION MODAL — COMIC × NEUBRUTALISM REDESIGN
           ══════════════════════════════════════════════════════════════ */
        #gachaAnimModal {
            position: fixed;
            inset: 0;
            background: #FFFBF0;
            background-image: radial-gradient(circle, #0A0A0A 1.5px, transparent 1.5px);
            background-size: 28px 28px;
            z-index: 9999;
            display: none;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px 16px;
            overflow: hidden;
        }

        /* Thick outer frame — comic panel feel */
        #gachaAnimModal::before {
            content: '';
            position: absolute;
            inset: 10px;
            border: 5px solid #0A0A0A;
            pointer-events: none;
            z-index: 0;
        }

        /* Corner accent marks */
        #gachaAnimModal::after {
            content: '';
            position: absolute;
            inset: 18px;
            border: 2px dashed rgba(10,10,10,0.12);
            pointer-events: none;
            z-index: 0;
        }

        /* ── Header ── */
        .gacha-modal-header {
            text-align: center;
            margin-bottom: 14px;
            position: relative;
            z-index: 2;
        }

        .gacha-modal-header h2 {
            font-family: var(--font-heading);
            font-size: clamp(1.1rem, 3.5vw, 1.6rem);
            color: var(--text-primary);
            font-weight: 900;
            letter-spacing: 2px;
            margin-bottom: 4px;
            text-transform: uppercase;
            -webkit-text-stroke: 1px var(--nb-border);
            border-bottom: 3px solid var(--nb-border);
            display: inline-block;
            padding-bottom: 6px;
        }

        .gacha-modal-header p {
            color: var(--text-secondary);
            font-size: 0.85rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 1.5px;
        }

        /* ── Comic Stage ── */
        .gacha-stage {
            width: min(480px, 94vw);
            min-height: 280px;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            transition: opacity 0.25s ease, transform 0.25s ease;
            z-index: 2;
        }

        .gacha-stage.is-hidden {
            opacity: 0;
            transform: scale(0.95) translateY(-10px);
            pointer-events: none;
            position: absolute;
        }

        /* ── Comic Frame (the launch panel) ── */
        .comic-launch-frame {
            width: 100%;
            background: var(--bg-card);
            border: 4px solid var(--nb-border);
            box-shadow: 8px 8px 0 var(--nb-border);
            padding: 28px 24px;
            position: relative;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 20px;
            overflow: hidden;
            cursor: pointer;
            user-select: none;
            touch-action: manipulation;
        }

        /* Speed lines background */
        .comic-launch-frame::before {
            content: '';
            position: absolute;
            inset: 0;
            background-image:
                repeating-linear-gradient(8deg,  transparent 0, transparent 10px, rgba(10,10,10,0.04) 10px, rgba(10,10,10,0.04) 11px),
                repeating-linear-gradient(-8deg, transparent 0, transparent 10px, rgba(10,10,10,0.03) 10px, rgba(10,10,10,0.03) 11px);
            pointer-events: none;
        }

        /* Corner screws */
        .comic-launch-frame::after {
            content: '✦  ✦';
            position: absolute;
            top: 10px;
            right: 14px;
            font-size: 0.7rem;
            color: var(--color-primary);
            font-weight: 900;
            letter-spacing: 8px;
        }

        /* BOOM text */
        .comic-boom-text {
            font-family: var(--font-heading);
            font-size: clamp(4rem, 16vw, 7rem);
            font-weight: 900;
            color: var(--color-primary);
            -webkit-text-stroke: 4px var(--nb-border);
            letter-spacing: -4px;
            line-height: 0.9;
            text-transform: uppercase;
            position: relative;
            animation: comicBoomPulse 1.2s ease-in-out infinite alternate;
            transform-origin: center;
        }

        .comic-boom-text::after {
            content: attr(data-label);
            position: absolute;
            top: -20px;
            left: 50%;
            transform: translateX(-50%) rotate(-6deg);
            font-size: 0.75rem;
            background: var(--color-cta);
            color: var(--nb-border);
            border: 2px solid var(--nb-border);
            padding: 2px 10px;
            font-weight: 900;
            letter-spacing: 2px;
            white-space: nowrap;
        }

        /* Sub-count badge */
        .comic-draw-count {
            font-family: var(--font-heading);
            font-size: 1rem;
            font-weight: 900;
            color: var(--nb-border);
            background: var(--color-cta);
            border: 3px solid var(--nb-border);
            padding: 4px 18px;
            letter-spacing: 3px;
            text-transform: uppercase;
            box-shadow: 3px 3px 0 var(--nb-border);
        }

        /* TAP TO DRAW button inside stage */
        .comic-tap-btn {
            background: var(--color-primary);
            color: #FFFFFF;
            border: 4px solid var(--nb-border);
            padding: 14px 36px;
            font-family: var(--font-heading);
            font-size: 1.1rem;
            font-weight: 900;
            letter-spacing: 3px;
            text-transform: uppercase;
            box-shadow: 5px 5px 0 var(--nb-border);
            cursor: pointer;
            -webkit-text-stroke: 0.5px #fff;
            transition: transform 0.08s, box-shadow 0.08s;
            position: relative;
            z-index: 1;
        }

        .comic-tap-btn:hover {
            transform: translate(-2px,-2px);
            box-shadow: 7px 7px 0 var(--nb-border);
        }

        .comic-tap-btn:active {
            transform: translate(4px,4px);
            box-shadow: 1px 1px 0 var(--nb-border);
        }

        /* ── BOOM explosion overlay (plays on launch) ── */
        .comic-explode-overlay {
            position: absolute;
            inset: 0;
            display: none;
            place-items: center;
            background: var(--color-cta);
            border: 4px solid var(--nb-border);
            z-index: 10;
            font-family: var(--font-heading);
            font-size: clamp(3rem, 14vw, 6rem);
            font-weight: 900;
            color: var(--nb-border);
            letter-spacing: -2px;
            -webkit-text-stroke: 2px var(--nb-border);
            text-align: center;
            animation: comicExplosion 0.45s cubic-bezier(.2,.8,.2,1) forwards;
        }

        .gacha-stage.is-opening .comic-explode-overlay {
            display: grid;
        }

        /* ── Animations ── */
        @keyframes comicBoomPulse {
            from { transform: scale(0.97) rotate(-1.5deg); }
            to   { transform: scale(1.03) rotate(1.5deg); }
        }

        @keyframes comicExplosion {
            0%   { opacity: 0; transform: scale(0.5); }
            40%  { opacity: 1; transform: scale(1.08); }
            70%  { transform: scale(0.96); }
            100% { opacity: 0; transform: scale(1.3); }
        }

        @keyframes comicSlam {
            0%   { opacity:0; transform: translateY(-60px) rotate(var(--tilt,0deg)) scale(0.7); }
            55%  { opacity:1; transform: translateY(6px) rotate(var(--tilt,0deg)) scale(1.04); }
            75%  { transform: translateY(-3px) rotate(var(--tilt,0deg)) scale(0.98); }
            100% { opacity:1; transform: translateY(0) rotate(var(--tilt,0deg)) scale(1); }
        }

        @keyframes comicFlipReveal {
            0%   { transform: rotateY(0deg) scale(1); }
            45%  { transform: rotateY(90deg) scale(1.05); }
            100% { transform: rotateY(180deg) scale(1); }
        }

        @keyframes comicShake {
            0%,100% { transform: rotateY(180deg) translateX(0); }
            20%     { transform: rotateY(180deg) translateX(-4px); }
            40%     { transform: rotateY(180deg) translateX(4px); }
            60%     { transform: rotateY(180deg) translateX(-2px); }
            80%     { transform: rotateY(180deg) translateX(2px); }
        }

        @keyframes popIn {
            0%   { opacity:0; transform: scale(0) rotate(-8deg); }
            65%  { opacity:1; transform: scale(1.15) rotate(4deg); }
            100% { opacity:1; transform: scale(1) rotate(0deg); }
        }

        @keyframes popOut {
            0%   { opacity:1; transform: scale(1); }
            100% { opacity:0; transform: scale(0.5) translateY(-20px); }
        }

        /* ── Scrollable card row ── */
        .gacha-results-row {
            display: flex;
            gap: 16px;
            overflow-x: auto;
            padding: 30px 40px;
            max-width: 95vw;
            perspective: 1200px;
            scrollbar-width: thin;
            scrollbar-color: var(--neon-cyan) transparent;
            opacity: 1;
            transform: translateY(0);
            transition: opacity 0.35s ease, transform 0.35s ease;
            scroll-snap-type: x proximity;
            -webkit-overflow-scrolling: touch;
        }

        .gacha-results-row.is-hidden {
            opacity: 0;
            transform: translateY(24px);
            pointer-events: none;
            position: absolute;
        }

        .gacha-results-row::-webkit-scrollbar { height: 4px; }
        .gacha-results-row::-webkit-scrollbar-track { background: transparent; }
        .gacha-results-row::-webkit-scrollbar-thumb { background: var(--neon-cyan); border-radius: 2px; }

        /* ── Card base (Neubrutalist — no rounded corners!) ── */
        .gc-card {
            flex: 0 0 148px;
            height: 216px;
            cursor: pointer;
            position: relative;
            perspective: 800px;
            /* slam-in with random tilt via JS inline style */
            animation: comicSlam 0.42s cubic-bezier(.2,.8,.2,1) both;
            scroll-snap-align: center;
            contain: layout paint;
        }

        /* TAP hint below card */
        .gc-card::after {
            content: '▼ TAP';
            position: absolute;
            left: 50%;
            bottom: -22px;
            transform: translateX(-50%);
            color: var(--nb-border);
            font-family: var(--font-heading);
            font-size: 0.6rem;
            font-weight: 900;
            letter-spacing: 3px;
            opacity: 0.55;
            transition: opacity 0.2s;
        }

        .gc-card.revealed::after {
            opacity: 0;
        }

        .gc-card-inner {
            width: 100%;
            height: 100%;
            position: relative;
            transform-style: preserve-3d;
            transition: transform 0.48s cubic-bezier(.4,.2,.2,1);
            will-change: transform;
        }

        .gc-card.revealed .gc-card-inner {
            transform: rotateY(180deg);
        }

        /* Shake on mythic/legendary reveal */
        .gc-card.shake-anim .gc-card-inner {
            animation: comicShake 0.35s ease-out forwards;
        }

        /* ── Back face ── */
        .gc-card-back, .gc-card-front {
            position: absolute;
            inset: 0;
            border-radius: 0;                        /* NO rounded corners! */
            backface-visibility: hidden;
            -webkit-backface-visibility: hidden;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 6px;
            padding: 12px;
            overflow: hidden;
        }

        .gc-card-back {
            background: var(--bg-card);
            border: 3px solid var(--nb-border);
            box-shadow: 4px 4px 0 var(--nb-border);
        }

        /* Halftone pattern on back */
        .gc-card-back-pattern {
            position: absolute;
            inset: 0;
            background-image: radial-gradient(circle, rgba(10,10,10,0.12) 1.5px, transparent 1.5px);
            background-size: 10px 10px;
        }

        /* Rarity symbol on back */
        .gc-card-back-icon {
            font-family: var(--font-heading);
            font-size: 2.6rem;
            font-weight: 900;
            color: var(--card-color, #0A0A0A);
            -webkit-text-stroke: 1px var(--nb-border);
            position: relative;
            z-index: 1;
        }

        .gc-card-back-label {
            font-family: var(--font-heading);
            font-size: 0.55rem;
            font-weight: 900;
            letter-spacing: 3px;
            text-transform: uppercase;
            color: var(--card-color, #0A0A0A);
            background: var(--card-color, #0A0A0A);
            color: #fff;
            padding: 2px 8px;
            position: relative;
            z-index: 1;
        }

        /* ── Front face ── */
        .gc-card-front {
            background: var(--card-front-bg, #FFFFFF);
            border: 3px solid var(--nb-border);
            box-shadow: 4px 4px 0 var(--nb-border);
            transform: rotateY(180deg);
        }

        /* Top color strip */
        .gc-card-front::before {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0;
            height: 6px;
            background: var(--card-color, #0A0A0A);
        }

        /* Diagonal speed-line accent on front */
        .gc-card-front::after {
            content: '';
            position: absolute;
            inset: 0;
            background-image: repeating-linear-gradient(
                45deg,
                transparent 0, transparent 8px,
                rgba(10,10,10,0.025) 8px, rgba(10,10,10,0.025) 9px
            );
            pointer-events: none;
        }

        /* Rarity label strip */
        .gc-rarity-band {
            font-family: var(--font-heading);
            font-size: 0.6rem;
            letter-spacing: 3px;
            font-weight: 900;
            color: #fff;
            background: var(--card-color, #0A0A0A);
            text-transform: uppercase;
            padding: 3px 10px;
            border-radius: 0;
            margin-top: 10px;
            position: relative;
            z-index: 1;
        }

        .gc-icon {
            font-size: 2.6rem;
            position: relative;
            z-index: 1;
        }

        .gc-name {
            font-family: var(--font-heading);
            font-size: 0.82rem;
            font-weight: 900;
            text-align: center;
            color: var(--nb-border);
            -webkit-text-stroke: 0.3px var(--nb-border);
            line-height: 1.2;
            word-break: break-all;
            position: relative;
            z-index: 1;
        }

        .gc-status {
            font-family: var(--font-heading);
            font-size: 0.62rem;
            font-weight: 900;
            padding: 3px 10px;
            border-radius: 0;
            letter-spacing: 2px;
            text-transform: uppercase;
            position: relative;
            z-index: 1;
        }
        .gc-status.is-new {
            background: var(--color-success);
            color: #fff;
            border: 2px solid var(--nb-border);
        }
        .gc-status.is-dupe {
            background: var(--color-cta);
            color: var(--nb-border);
            border: 2px solid var(--nb-border);
        }

        /* ── Mythic / Legendary: border flash ── */
        .gc-card[data-rarity="MYTHIC"].revealed {
            animation: nbMythicBorderFlash 1s steps(1) infinite;
        }
        @keyframes nbMythicBorderFlash {
            0%,100% { outline: 0px solid transparent; }
            50% { outline: 4px solid #ff3366; outline-offset: 2px; }
        }
        .gc-card[data-rarity="LEGENDARY"].revealed {
            animation: nbLegendBorderFlash 1.2s steps(1) infinite;
        }
        @keyframes nbLegendBorderFlash {
            0%,100% { outline: 0px solid transparent; }
            50% { outline: 4px solid #FFD700; outline-offset: 2px; }
        }

        /* ── Comic pop bubble (NEW! / +EXP) ── */
        .comic-pop-bubble {
            position: fixed;
            pointer-events: none;
            z-index: 99999;
            font-family: var(--font-heading);
            font-size: 1.1rem;
            font-weight: 900;
            color: var(--nb-border);
            background: var(--color-cta);
            border: 3px solid var(--nb-border);
            padding: 4px 14px;
            box-shadow: 3px 3px 0 var(--nb-border);
            border-radius: 0;
            animation: popIn 0.32s cubic-bezier(.2,.8,.2,1) forwards, popOut 0.3s 0.9s ease-in forwards;
            transform-origin: bottom center;
            letter-spacing: 1px;
            text-transform: uppercase;
        }
        .comic-pop-bubble.is-new {
            background: var(--color-success);
            color: #fff;
        }
        .comic-pop-bubble.is-dupe {
            background: var(--color-cta);
            color: var(--nb-border);
        }
        .comic-pop-bubble.is-mythic {
            background: #ff3366;
            color: #fff;
            font-size: 1.4rem;
        }

        /* Speed line burst (replaces particle orbs) */
        @keyframes comicLineFly {
            from { opacity:0.9; transform: scaleX(0.1) translateX(0); }
            to   { opacity:0;   transform: scaleX(1)   translateX(var(--ddx,60px)); }
        }

        /* ── Bottom action bar ── */
        .gacha-modal-footer {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 8px;
            margin-top: 8px;
            z-index: 2;
            position: relative;
        }

        #btnSkipAnim {
            padding: 12px 40px;
            font-family: var(--font-heading);
            font-size: 1rem;
            font-weight: 900;
            letter-spacing: 3px;
            text-transform: uppercase;
            background: var(--nb-border);
            border: 3px solid var(--nb-border);
            color: #FFFFFF;
            border-radius: 0;
            cursor: pointer;
            box-shadow: 4px 4px 0 rgba(10,10,10,0.35);
            transition: transform 0.08s, box-shadow 0.08s;
        }
        #btnSkipAnim:hover {
            transform: translate(-2px,-2px);
            box-shadow: 6px 6px 0 rgba(10,10,10,0.35);
        }
        #btnSkipAnim:active {
            transform: translate(3px,3px);
            box-shadow: 1px 1px 0 rgba(10,10,10,0.35);
        }
        #btnSkipAnim.is-done {
            background: var(--color-success);
            border-color: var(--nb-border);
            color: #fff;
        }

        #btnRevealAll {
            font-family: var(--font-heading);
            font-size: 0.72rem;
            font-weight: 900;
            background: none;
            border: 2px solid var(--text-muted);
            color: var(--text-muted);
            cursor: pointer;
            padding: 4px 14px;
            letter-spacing: 2px;
            text-transform: uppercase;
            transition: all 0.1s;
            border-radius: 0;
        }
        #btnRevealAll:hover {
            border-color: var(--nb-border);
            color: var(--nb-border);
        }

        @media (max-width: 640px) {
            #gachaAnimModal {
                padding: 14px 8px;
            }
            #gachaAnimModal::before { inset: 6px; }
            #gachaAnimModal::after  { inset: 12px; }

            .gacha-results-row {
                gap: 10px;
                padding: 22px 14px 32px;
                max-width: 100vw;
            }

            .gc-card {
                flex-basis: 122px;
                height: 182px;
            }

            .gacha-modal-footer {
                width: 100%;
            }

            #btnSkipAnim {
                width: min(320px, 88vw);
            }

            .comic-boom-text {
                font-size: clamp(3rem, 18vw, 5rem);
            }
        }

        @media (prefers-reduced-motion: reduce) {
            .gc-card,
            .gc-card-back-icon,
            .gc-card[data-rarity="MYTHIC"].revealed,
            .gc-card[data-rarity="LEGENDARY"].revealed {
                animation: none !important;
            }

            .gc-card-inner {
                transition-duration: 0.1s;
            }
        }

        /* ── Rarity front-face backgrounds (comic print palette) ── */
        /* COMMON  */ .gc-card[data-rarity="COMMON"]    { --card-front-bg: #F8F5EF; }
        /* RARE    */ .gc-card[data-rarity="RARE"]      { --card-front-bg: #EFF6FF; }
        /* EPIC    */ .gc-card[data-rarity="EPIC"]      { --card-front-bg: #FAF0FF; }
        /* LEGENDARY*/ .gc-card[data-rarity="LEGENDARY"] { --card-front-bg: #FFFBEB; }
        /* MYTHIC  */ .gc-card[data-rarity="MYTHIC"]    { --card-front-bg: #FFF1F5; }
        /* SPECIAL */ .gc-card[data-rarity="SPECIAL"]   { --card-front-bg: #F0FDF6; }

        .loading-spinner {
            display: inline-block;
            width: 14px;
            height: 14px;
            border: 2px solid rgba(255,255,255,.3);
            border-radius: 50%;
            border-top-color: #fff;
            animation: spin 1s linear infinite;
            vertical-align: middle;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
        
        button:disabled {
            cursor: not-allowed !important;
            opacity: 0.6;
            filter: grayscale(0.8);
            transform: none !important;
            box-shadow: none !important;
        }

        @keyframes fadeIn { from { opacity:0; } to { opacity:1; } }

    </style>
</head>

<body>
    <div id="pageLoading" style="position:fixed;inset:0;background:#0F0F23;display:flex;align-items:center;justify-content:center;z-index:9999;">
        <div class="" style="color:var(--neon-cyan);font-family:var(--font-heading);font-size:1.5rem;animation:pulse 1.5s infinite;">載入中...</div>
    </div>

    <div class="shop-page" id="shopPage" style="display:none;">
        <div class="header-row">
            <a href="index.html" class="back-btn">← 返回主選單</a>
            <div class="currency-bar">
                <div class="currency-item c-money" title="錢錢"><img src="item_pic/錢錢.png" class="item-icon-inline"> <span id="v-money">0</span></div>
                <div class="currency-item c-deed" title="地契"><img src="item_pic/地契.png" class="item-icon-inline"> <span id="v-deed">0</span></div>
                <div class="currency-item" style="width:1px;background:var(--glass-border);height:16px;margin:0 5px;"></div>
                <div class="currency-item c-t1" title="普通抽獎券"><img src="item_pic/普通抽獎券.png" class="item-icon-inline"> <span id="v-ticket-normal">0</span></div>
                <div class="currency-item c-t2" title="高級抽獎券"><img src="item_pic/高級抽獎券.png" class="item-icon-inline"> <span id="v-ticket-premium">0</span></div>
                <div class="currency-item c-t3" title="特殊抽獎券"><img src="item_pic/特殊抽獎券.png" class="item-icon-inline"> <span id="v-ticket-special">0</span></div>
            </div>
        </div>

        <div class="tabs">
            <button class="tab-btn active" onclick="switchTab('gacha')" id="tab-gacha">機率抽獎</button>
            <button class="tab-btn" onclick="switchTab('shop')" id="tab-shop">資源商店</button>
        </div>

        <!-- Gacha Section -->
        <div class="tab-content active" id="content-gacha">
            <div class="gacha-container">
                <div class="pool-list" id="poolList">
                    <!-- Injected via JS -->
                </div>
                <div class="gacha-display">
                    <div class="gacha-banner" id="poolBanner">
                        ✨ 選擇獎池
                    </div>
                    <div class="gacha-rates" id="poolDesc">
                        請從左側選擇一個獎池來查看詳情。
                    </div>
                    <div class="gacha-content-list" id="poolContent">
                        <!-- Characters list injected via JS -->
                    </div>
                    <div class="gacha-actions" id="poolActions" style="display:none;">
                        <button class="btn btn-pull" id="btnPull1" onclick="performPull(1)">
                            單次抽取
                            <span class="cost" id="costPull1">-</span>
                        </button>
                        <button class="btn btn-gold btn-pull" id="btnPull10" onclick="performPull(10)">
                            十連抽取
                            <span class="cost" id="costPull10">-</span>
                        </button>
                    </div>
                </div>
            </div>
        </div>

        <!-- Shop Section -->
        <div class="tab-content" id="content-shop">
            <div class="shop-grid" id="shopGrid">
                <!-- Injected via JS -->
            </div>
        </div>

    </div>

    <!-- Gacha Animation Modal — Comic × Neubrutalism -->
    <div id="gachaAnimModal">
        <div class="gacha-modal-header" style="z-index:2;position:relative;">
            <h2 id="gachaAnimTitle">DRAW!!</h2>
            <p id="gachaAnimHint">點擊啟動，讓命運決定！</p>
        </div>
        <div class="gacha-stage" id="gachaStage"></div>
        <div class="gacha-results-row is-hidden" id="gachaResults"></div>
        <div class="gacha-modal-footer">
            <button id="btnSkipAnim" onclick="skipAnim()">▶ 啟動抽獎</button>
            <button id="btnRevealAll" onclick="revealAll()">一鍵全開</button>
        </div>
    </div>

</body>
</html>
