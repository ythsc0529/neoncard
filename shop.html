<!DOCTYPE html>
<html lang="zh-TW">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>霓虹牌 - 商店與抽獎</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Noto+Sans+TC:wght@300;400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/styles.css">
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
    <script src="js/theme.js"></script>
    <script src="js/core/auth.js"></script>
    <script src="js/core/userProfile.js"></script>
    <script src="js/data/missionData.js"></script>
    <script src="js/data/passData.js"></script>
    <script src="js/data/trialData.js"></script>
    <script src="js/data/gachaData.js"></script>
    <script src="js/ui/soundManager.js"></script>
    <script src="js/core/notificationManager.js"></script>
    <script src="js/data/characters_part1.js"></script>
    <script src="js/data/characters_part2.js"></script>
    <script src="js/data/characters_part3.js"></script>
    <script src="js/data/characters_part4.js"></script>
    <script src="js/data/characters_part5.js"></script>
    <script src="js/data/characters_part6.js"></script>
    <script src="js/data/characters.js"></script>
    <script src="js/ui/shop.js" defer></script>
    <style>
        body {
            background-color: var(--bg-secondary);
            background-image: var(--comic-halftone);
            background-size: 20px 20px;
            min-height: 100vh;
            color: var(--text-primary);
        }

        .shop-page {
            max-width: 1100px;
            margin: 0 auto;
            padding: 20px;
        }

        .header-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 24px;
        }

        .back-btn {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            color: var(--text-primary);
            text-decoration: none;
            font-family: var(--font-heading);
            font-weight: 700;
            letter-spacing: 1px;
            text-transform: uppercase;
            transition: transform 0.08s ease;
        }

        .back-btn:hover {
            color: var(--color-primary);
            transform: translateX(-3px);
        }

        .currency-bar {
            display: flex;
            gap: 12px;
            background: var(--bg-card);
            border: var(--nb-border-width) solid var(--nb-border);
            border-radius: 4px;
            padding: 8px 14px;
            box-shadow: var(--nb-shadow-sm);
        }

        .currency-item {
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 0.9rem;
            font-family: var(--font-heading);
            font-weight: 700;
            color: var(--text-primary);
        }

        .item-icon-inline {
            width: 20px;
            height: 20px;
            vertical-align: middle;
            object-fit: contain;
        }

        .shop-item-icon-container {
            height: 100px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 15px;
        }

        .shop-item-img {
            max-height: 100px;
            max-width: 100%;
            transition: transform 0.3s;
        }

        .shop-item:hover .shop-item-img {
            transform: scale(1.1);
        }
        
        .c-money { color: #92400E; font-weight: 900; }
        .c-deed  { color: #C2410C; font-weight: 900; }
        .c-t1    { color: var(--text-secondary); font-weight: 700; }
        .c-t2    { color: #1D4ED8; font-weight: 900; }
        .c-t3    { color: #7E22CE; font-weight: 900; }

        /* Bundle Specific Styles */
        .shop-item.purchased {
            filter: grayscale(0.5);
            opacity: 0.8;
            pointer-events: none;
        }

        .shop-item-tag {
            position: absolute;
            top: 10px;
            left: 10px;
            padding: 3px 8px;
            border-radius: 4px;
            font-size: 0.65rem;
            font-weight: bold;
            text-transform: uppercase;
            letter-spacing: 1px;
            z-index: 10;
        }
        .shop-item-tag.bundle {
            background: var(--color-purple);
            color: white;
            border: 2px solid var(--nb-border);
        }
        .shop-item-tag.item {
            background: var(--bg-secondary);
            color: var(--text-secondary);
            border: 2px solid var(--nb-border);
        }

        .bundle-details {
            margin: 10px 0;
            padding: 8px;
            background: var(--bg-secondary);
            border-radius: 4px;
            border: 2px solid var(--nb-border);
        }

        .bundle-item-chip {
            background: var(--bg-card);
            padding: 2px 6px;
            border-radius: 2px;
            font-size: 0.7rem;
            color: var(--text-primary);
            border: 2px solid var(--nb-border);
            white-space: nowrap;
            font-weight: 700;
        }

        .shop-item-limit {
            font-size: 0.75rem;
            color: var(--text-muted);
            margin-bottom: 8px;
            background: rgba(0,0,0,0.3);
            display: inline-block;
            padding: 2px 8px;
            border-radius: 10px;
        }

        .shop-item.purchased .btn-buy {
            display: none;
        }

        .tabs {
            display: flex;
            gap: 0;
            margin-bottom: 24px;
            border-bottom: var(--nb-border-width) solid var(--nb-border);
        }

        .tab-btn {
            padding: 12px 24px;
            background: var(--bg-secondary);
            border: var(--nb-border-width) solid var(--nb-border);
            border-bottom: none;
            color: var(--text-muted);
            font-family: var(--font-heading);
            font-size: 1rem;
            font-weight: 700;
            cursor: pointer;
            transition: transform 0.08s ease;
            position: relative;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-right: -3px;
        }

        .tab-btn::after { display: none; }

        .tab-btn.active {
            color: var(--nb-border);
            background: var(--color-cta);
            z-index: 1;
        }

        .tab-content {
            display: none;
        }

        .tab-content.active {
            display: block;
            animation: fadeIn 0.3s ease;
        }

        /* Shop Grid */
        .shop-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
            gap: 20px;
        }

        .shop-item {
            background: var(--bg-card);
            border: var(--nb-border-width) solid var(--nb-border);
            border-radius: 4px;
            padding: 20px;
            text-align: center;
            transition: transform 0.08s ease, box-shadow 0.08s ease;
            position: relative;
            overflow: hidden;
            box-shadow: var(--nb-shadow);
        }

        .shop-item:hover {
            border-color: var(--color-primary);
            transform: translate(-3px, -3px);
            box-shadow: var(--nb-shadow-lg);
        }

        .shop-item:active {
            transform: translate(4px, 4px);
            box-shadow: none;
        }

        .shop-item-title {
            font-family: var(--font-heading);
            font-size: 1.2rem;
            font-weight: 900;
            margin-bottom: 10px;
            color: var(--text-primary);
            text-transform: uppercase;
            letter-spacing: -0.5px;
        }

        .shop-item-desc {
            font-size: 0.85rem;
            color: var(--text-secondary);
            margin-bottom: 14px;
            min-height: 40px;
            font-weight: 500;
        }

        .shop-item-limit {
            font-size: 0.75rem;
            color: var(--neon-pink);
            margin-bottom: 10px;
        }

        .btn-buy {
            width: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            font-size: 1rem;
            padding: 10px;
        }

        /* Gacha Pools Layout */
        .gacha-container {
            display: grid;
            grid-template-columns: 260px 1fr;
            gap: 24px;
        }

        @media (max-width: 768px) {
            .gacha-container {
                grid-template-columns: 1fr;
            }
        }

        .pool-list {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .pool-btn {
            background: var(--bg-card);
            border: var(--nb-border-width) solid var(--nb-border);
            border-radius: 4px;
            padding: 14px;
            text-align: left;
            cursor: pointer;
            transition: transform 0.08s ease, box-shadow 0.08s ease;
            display: flex;
            flex-direction: column;
            box-shadow: var(--nb-shadow-sm);
        }

        .pool-btn:hover {
            border-color: var(--color-primary);
            transform: translate(-2px, -2px);
            box-shadow: var(--nb-shadow);
            background: #FFF0E8;
        }

        .pool-btn.active {
            border-color: var(--color-primary);
            background: #FFF0E8;
            box-shadow: var(--nb-shadow);
        }

        .pool-title {
            font-family: var(--font-heading);
            font-size: 1.05rem;
            font-weight: 900;
            color: var(--text-primary);
            margin-bottom: 4px;
            text-transform: uppercase;
        }

        .pool-subtitle {
            font-size: 0.78rem;
            color: var(--text-muted);
            font-weight: 600;
        }

        .gacha-display {
            background: var(--bg-card);
            border: var(--nb-border-width) solid var(--nb-border);
            border-radius: 4px;
            padding: 28px;
            display: flex;
            flex-direction: column;
            align-items: center;
            position: relative;
            box-shadow: var(--nb-shadow-lg);
        }

        .gacha-banner {
            width: 100%;
            height: 180px;
            border-radius: 4px;
            background: var(--bg-secondary);
            border: var(--nb-border-width) solid var(--nb-border);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 2rem;
            margin-bottom: 20px;
            box-shadow: var(--nb-shadow-sm);
        }

        .gacha-rates {
            width: 100%;
            margin-bottom: 0;
            font-size: 0.85rem;
            line-height: 1.5;
            color: var(--text-secondary);
            background: var(--bg-secondary);
            padding: 14px;
            border-top-left-radius: 4px;
            border-top-right-radius: 4px;
            border: var(--nb-border-width) solid var(--nb-border);
            border-bottom: none;
            font-weight: 600;
        }

        .gacha-content-list {
            width: 100%;
            height: 180px;
            background: var(--bg-card);
            border-bottom-left-radius: 4px;
            border-bottom-right-radius: 4px;
            padding: 14px;
            margin-bottom: 20px;
            overflow-y: auto;
            display: flex;
            flex-wrap: wrap;
            align-content: flex-start;
            gap: 8px;
            scrollbar-width: thin;
            scrollbar-color: var(--nb-border) var(--bg-secondary);
            border: var(--nb-border-width) solid var(--nb-border);
            border-top: none;
        }

        .content-chip {
            background: var(--bg-secondary);
            border: 2px solid var(--nb-border);
            border-radius: 2px;
            padding: 4px 10px;
            font-size: 0.75rem;
            color: var(--text-secondary);
            display: flex;
            align-items: center;
            gap: 4px;
            font-weight: 700;
        }

        .content-chip[data-rarity="MYTHIC"]    { border-color: #9F1239; color: #9F1239; background: #FFF1F2; }
        .content-chip[data-rarity="LEGENDARY"] { border-color: #92400E; color: #92400E; background: #FFFBEB; }
        .content-chip[data-rarity="EPIC"]      { border-color: #7E22CE; color: #7E22CE; background: #FAF5FF; }
        .content-chip[data-rarity="RARE"]      { border-color: #1D4ED8; color: #1D4ED8; background: #EFF6FF; }
        .content-chip[data-rarity="COMMON"]    { border-color: #6B7280; color: #6B7280; background: #F9FAFB; }
        .content-chip[data-rarity="SPECIAL"]   { border-color: #166534; color: #166534; background: #F0FDF4; }

        .gacha-actions {
            display: flex;
            gap: 20px;
            width: 100%;
            justify-content: center;
        }

        .btn-pull {
            padding: 14px 36px;
            font-size: 1.1rem;
            font-weight: 900;
            font-family: var(--font-heading);
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 4px;
            min-width: 180px;
            background: var(--color-primary);
            color: #FFFFFF;
            border: var(--nb-border-width) solid var(--nb-border);
            border-radius: 4px;
            cursor: pointer;
            transition: transform 0.08s ease, box-shadow 0.08s ease;
            box-shadow: var(--nb-shadow);
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .btn-pull:hover {
            background: #E63A0F;
            transform: translate(-2px, -2px);
            box-shadow: var(--nb-shadow-lg);
        }

        .btn-pull:active {
            transform: translate(4px, 4px);
            box-shadow: none;
        }

        .btn-pull .cost {
            font-size: 0.85rem;
            opacity: 0.8;
            font-family: var(--font-main);
        }

        /* ── Gacha Animation Modal ─────────────────────────────────── */
        #gachaAnimModal {
            position: fixed;
            inset: 0;
            background: rgba(255, 248, 220, 0.96);
            background-image: var(--comic-halftone);
            background-size: 18px 18px;
            z-index: 9999;
            display: none;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 24px 16px;
            overflow: hidden;
        }

        .gacha-modal-header {
            text-align: center;
            margin-bottom: 18px;
            position: relative;
            z-index: 2;
        }

        .gacha-modal-header h2 {
            font-family: var(--font-heading);
            font-size: clamp(1.35rem, 4vw, 2rem);
            color: var(--text-primary);
            font-weight: 900;
            letter-spacing: -1px;
            margin-bottom: 6px;
            text-transform: uppercase;
            -webkit-text-stroke: 1px var(--nb-border);
        }

        .gacha-modal-header p {
            color: var(--text-secondary);
            font-size: 0.9rem;
            font-weight: 600;
        }

        .gacha-stage {
            width: min(520px, 92vw);
            min-height: 300px;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            transition: opacity 0.35s ease, transform 0.35s ease;
        }

        .gacha-stage.is-hidden {
            opacity: 0;
            transform: scale(0.92);
            pointer-events: none;
            position: absolute;
        }

        .gacha-machine {
            width: min(360px, 82vw);
            aspect-ratio: 1;
            border: var(--nb-border-width) solid var(--nb-border);
            border-radius: 50%;
            background: var(--bg-secondary);
            box-shadow: var(--nb-shadow-xl);
            position: relative;
            display: grid;
            place-items: center;
            cursor: pointer;
            user-select: none;
            touch-action: manipulation;
            overflow: hidden;
        }

        .gacha-portal {
            position: absolute;
            inset: 4%;
            border-radius: 50%;
            background: conic-gradient(from 0deg,
                transparent 0 10%,
                var(--color-primary) 18%,
                transparent 28% 42%,
                var(--color-cta) 48%,
                transparent 58% 72%,
                var(--color-secondary) 80%,
                transparent 92%
            );
            animation: gachaPortalSpin 2.4s linear infinite;
        }

        .gacha-portal::after {
            content: '';
            position: absolute;
            inset: 18%;
            border-radius: 50%;
            background: radial-gradient(circle, rgba(255,255,255,0.55), var(--gacha-best, var(--neon-cyan)) 20%, transparent 58%);
            opacity: 0.45;
            animation: gachaPortalBreath 1s ease-in-out infinite alternate;
        }

        .gacha-summon-gate {
            position: absolute;
            width: 72%;
            aspect-ratio: 1;
            border-radius: 50%;
            border: 2px solid rgba(255,255,255,0.2);
            box-shadow: 0 0 28px var(--gacha-glow, rgba(0,243,255,0.55)), inset 0 0 42px rgba(255,255,255,0.08);
            animation: gachaGateFloat 1.8s ease-in-out infinite alternate;
        }

        .gacha-machine::before,
        .gacha-machine::after {
            content: '';
            position: absolute;
            inset: 11%;
            border-radius: 50%;
            border: 1px dashed rgba(255,255,255,0.18);
            animation: gachaRingSpin 7s linear infinite;
        }

        .gacha-machine::after {
            inset: 22%;
            border-color: rgba(255, 215, 0, 0.28);
            animation-direction: reverse;
            animation-duration: 5s;
        }

        .gacha-core {
            width: 44%;
            aspect-ratio: 1;
            border-radius: 50%;
            display: grid;
            place-items: center;
            position: relative;
            z-index: 2;
            background: var(--color-primary);
            border: var(--nb-border-width) solid var(--nb-border);
            box-shadow: var(--nb-shadow-lg);
            animation: gachaCorePulse 1.2s ease-in-out infinite alternate;
        }

        .gacha-core-icon {
            font-size: clamp(2.3rem, 9vw, 4rem);
            filter: drop-shadow(0 0 14px rgba(255,255,255,0.55));
        }

        .gacha-prompt {
            position: absolute;
            bottom: 34px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 3;
            padding: 8px 16px;
            color: var(--text-primary);
            font-size: 0.78rem;
            font-weight: 700;
            font-family: var(--font-heading);
            letter-spacing: 2px;
            border: var(--nb-border-width) solid var(--nb-border);
            border-radius: 4px;
            background: var(--bg-card);
            box-shadow: var(--nb-shadow-sm);
            text-transform: uppercase;
        }

        .gacha-energy-track {
            position: absolute;
            left: 50%;
            bottom: 18px;
            transform: translateX(-50%);
            width: 64%;
            height: 8px;
            border-radius: 0;
            background: var(--bg-secondary);
            border: 2px solid var(--nb-border);
            overflow: hidden;
            z-index: 3;
        }

        .gacha-energy-fill {
            width: 0%;
            height: 100%;
            border-radius: 0;
            background: var(--color-primary);
            border-right: 2px solid var(--nb-border);
            animation: gachaCharge 1.25s ease-out forwards;
        }

        .gacha-stage.is-opening .gacha-machine {
            animation: gachaMachineOpen 0.75s cubic-bezier(.16,1,.3,1) forwards;
        }

        .gacha-stage.is-opening .gacha-core {
            animation: gachaCoreBurst 0.75s cubic-bezier(.16,1,.3,1) forwards;
        }

        .gacha-burst {
            position: absolute;
            width: 14px;
            height: 14px;
            border-radius: 50%;
            background: var(--color-primary);
            border: 2px solid var(--nb-border);
            opacity: 0;
            pointer-events: none;
        }

        .gacha-stage.is-opening .gacha-burst {
            animation: gachaBurstRay 0.7s ease-out forwards;
        }

        @keyframes gachaRingSpin {
            to { transform: rotate(360deg); }
        }

        @keyframes gachaPortalSpin {
            to { transform: rotate(360deg); }
        }

        @keyframes gachaPortalBreath {
            from { transform: scale(0.88); opacity: 0.35; }
            to { transform: scale(1.08); opacity: 0.72; }
        }

        @keyframes gachaGateFloat {
            from { transform: scale(0.96) rotate(-4deg); }
            to { transform: scale(1.04) rotate(4deg); }
        }

        @keyframes gachaCorePulse {
            from { transform: scale(0.98); }
            to { transform: scale(1.05); }
        }

        @keyframes gachaCharge {
            from { width: 0%; }
            to { width: 100%; }
        }

        @keyframes gachaMachineOpen {
            0% { transform: scale(1); filter: brightness(1); }
            45% { transform: scale(1.06); filter: brightness(1.45); }
            100% { transform: scale(0.84); filter: brightness(1.9); opacity: 0; }
        }

        @keyframes gachaCoreBurst {
            0% { transform: scale(1); }
            100% { transform: scale(2.1); opacity: 0; }
        }

        @keyframes gachaBurstRay {
            0% { opacity: 1; transform: translate(-50%, -50%) scale(0.6); }
            100% { opacity: 0; transform: translate(calc(-50% + var(--dx)), calc(-50% + var(--dy))) scale(0.05); }
        }

        /* Scrollable card row */
        .gacha-results-row {
            display: flex;
            gap: 16px;
            overflow-x: auto;
            padding: 30px 40px;
            max-width: 95vw;
            perspective: 1200px;
            scrollbar-width: thin;
            scrollbar-color: var(--neon-cyan) transparent;
            opacity: 1;
            transform: translateY(0);
            transition: opacity 0.35s ease, transform 0.35s ease;
            scroll-snap-type: x proximity;
            -webkit-overflow-scrolling: touch;
        }

        .gacha-results-row.is-hidden {
            opacity: 0;
            transform: translateY(24px);
            pointer-events: none;
            position: absolute;
        }

        .gacha-results-row::-webkit-scrollbar { height: 4px; }
        .gacha-results-row::-webkit-scrollbar-track { background: transparent; }
        .gacha-results-row::-webkit-scrollbar-thumb { background: var(--neon-cyan); border-radius: 2px; }

        /* Card base */
        .gc-card {
            flex: 0 0 150px;
            height: 220px;
            cursor: pointer;
            position: relative;
            perspective: 800px;
            animation: gcCardSlideIn 0.5s cubic-bezier(.2,.8,.2,1) both;
            scroll-snap-align: center;
            contain: layout paint;
        }

        .gc-card::after {
            content: 'TAP';
            position: absolute;
            left: 50%;
            bottom: -22px;
            transform: translateX(-50%);
            color: var(--card-color);
            font-size: 0.62rem;
            letter-spacing: 2px;
            opacity: 0.7;
            transition: opacity 0.2s;
        }

        .gc-card.revealed::after {
            opacity: 0;
        }

        @keyframes gcCardSlideIn {
            from { opacity:0; transform: translateY(40px) scale(0.85); }
            to   { opacity:1; transform: translateY(0) scale(1); }
        }

        .gc-card-inner {
            width: 100%;
            height: 100%;
            position: relative;
            transform-style: preserve-3d;
            transition: transform 0.55s cubic-bezier(.4,.2,.2,1);
            will-change: transform;
        }

        .gc-card.revealed .gc-card-inner {
            transform: rotateY(180deg);
        }

        /* Back face */
        .gc-card-back, .gc-card-front {
            position: absolute;
            inset: 0;
            border-radius: 14px;
            backface-visibility: hidden;
            -webkit-backface-visibility: hidden;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 8px;
            padding: 14px;
            overflow: hidden;
        }

        .gc-card-back {
            background: var(--bg-secondary);
            border: var(--nb-border-width) solid var(--nb-border);
            box-shadow: var(--nb-shadow);
        }

        .gc-card-back-pattern {
            position: absolute;
            inset: 0;
            background-image: var(--comic-halftone);
            background-size: 12px 12px;
        }

        .gc-card-back-icon {
            font-size: 2.5rem;
            color: var(--color-primary);
            animation: gcBackPulse 2s infinite alternate;
        }

        @keyframes gcBackPulse {
            from { opacity: 0.5; transform: scale(0.95); }
            to   { opacity: 1;   transform: scale(1.05); }
        }

        /* Front face */
        .gc-card-front {
            background: var(--card-bg, linear-gradient(135deg,#1a1a1a,#2a2a2a));
            border: 2px solid var(--card-color, #aaa);
            box-shadow: 0 0 18px var(--card-glow, rgba(180,180,180,0.2)), inset 0 0 15px rgba(0,0,0,0.4);
            transform: rotateY(180deg);
        }

        /* Shimmer sweep on revealed cards */
        .gc-card.revealed .gc-card-front::after {
            content: '';
            position: absolute;
            top: -50%; left: -60%;
            width: 40%; height: 200%;
            background: linear-gradient(105deg, transparent, rgba(255,255,255,0.12), transparent);
            animation: gcShimmer 1s ease-out forwards;
        }
        @keyframes gcShimmer {
            from { left: -60%; }
            to   { left: 120%; }
        }

        .gc-rarity-band {
            font-family: var(--font-heading);
            font-size: 0.65rem;
            letter-spacing: 2px;
            color: var(--card-color);
            
            text-transform: uppercase;
            border: 1px solid var(--card-color);
            padding: 2px 8px;
            border-radius: 4px;
            opacity: 0.9;
        }

        .gc-icon {
            font-size: 2.8rem;
            filter: drop-shadow(0 0 12px var(--card-glow, rgba(255,255,255,0.2)));
        }

        .gc-name {
            font-family: var(--font-heading);
            font-size: 0.85rem;
            text-align: center;
            color: white;
            text-shadow: 0 0 12px rgba(255,255,255,0.18);
            line-height: 1.3;
            word-break: break-all;
        }

        .gc-status {
            font-size: 0.7rem;
            padding: 3px 10px;
            border-radius: 20px;
            font-weight: bold;
            letter-spacing: 1px;
        }
        .gc-status.is-new {
            background: rgba(0,255,104,0.15);
            color: var(--neon-green);
            border: 1px solid var(--neon-green);
            box-shadow: 0 0 14px rgba(0,255,104,0.18);
        }
        .gc-status.is-dupe {
            background: rgba(255,215,0,0.1);
            color: var(--neon-gold);
            border: 1px solid rgba(255,215,0,0.4);
        }

        /* MYTHIC/LEGENDARY glow on revealed front */
        .gc-card[data-rarity="MYTHIC"].revealed .gc-card-front {
            animation: mythicPulse 1.5s infinite;
        }
        @keyframes mythicPulse {
            0%,100% { box-shadow: 0 0 22px rgba(255,51,102,0.5), inset 0 0 15px rgba(0,0,0,0.4); }
            50% { box-shadow: 0 0 56px rgba(255,51,102,0.65), 0 0 90px rgba(255,51,102,0.26), inset 0 0 15px rgba(0,0,0,0.4); }
        }
        .gc-card[data-rarity="LEGENDARY"].revealed .gc-card-front {
            animation: legendPulse 2s infinite;
        }
        @keyframes legendPulse {
            0%,100% { box-shadow: 0 0 20px rgba(255,215,0,0.45), inset 0 0 15px rgba(0,0,0,0.4); }
            50% { box-shadow: 0 0 48px rgba(255,215,0,0.58), 0 0 80px rgba(255,215,0,0.22), inset 0 0 15px rgba(0,0,0,0.4); }
        }

        /* Particle animation */
        @keyframes particleFly {
            from { transform: translate(0,0) scale(1); opacity:1; }
            to   { transform: translate(var(--dx), var(--dy)) scale(0); opacity:0; }
        }

        /* Bottom action bar */
        .gacha-modal-footer {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 10px;
            margin-top: 10px;
        }

        #btnSkipAnim {
            padding: 12px 40px;
            font-family: var(--font-heading);
            font-size: 1rem;
            letter-spacing: 2px;
            background: rgba(255,255,255,0.03);
            border: 1px solid var(--neon-cyan);
            color: var(--neon-cyan);
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.3s;
        }
        #btnSkipAnim:hover {
            background: rgba(0,243,255,0.1);
            transform: translateY(-1px);
        }

        #btnRevealAll {
            font-size: 0.8rem;
            background: none;
            border: none;
            color: var(--text-muted);
            cursor: pointer;
            text-decoration: underline;
            padding: 4px;
        }
        #btnRevealAll:hover { color: white; }

        @media (max-width: 640px) {
            #gachaAnimModal {
                backdrop-filter: none;
                padding: 18px 8px;
            }

            .gacha-results-row {
                gap: 12px;
                padding: 24px 18px 32px;
                max-width: 100vw;
            }

            .gc-card {
                flex-basis: 128px;
                height: 190px;
            }

            .gacha-modal-footer {
                width: 100%;
            }

            #btnSkipAnim {
                width: min(320px, 88vw);
            }
        }

        @media (prefers-reduced-motion: reduce) {
            .gacha-machine::before,
            .gacha-machine::after,
            .gacha-core,
            .gc-card,
            .gc-card-back-icon,
            .gc-card[data-rarity="MYTHIC"].revealed .gc-card-front,
            .gc-card[data-rarity="LEGENDARY"].revealed .gc-card-front {
                animation: none !important;
            }

            .gc-card-inner {
                transition-duration: 0.1s;
            }
        }

        /* Rarity colors for modal (override) */
        .rarity-common   { border-color: #ffffff;  }
        .rarity-rare     { border-color: #4a9eff;  }
        .rarity-epic     { border-color: #cc44ff;  }
        .rarity-legendary{ border-color: #ffd700;  }
        .rarity-mythic   { border-color: #ff3366;  }

        .loading-spinner {
            display: inline-block;
            width: 14px;
            height: 14px;
            border: 2px solid rgba(255,255,255,.3);
            border-radius: 50%;
            border-top-color: #fff;
            animation: spin 1s linear infinite;
            vertical-align: middle;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
        
        button:disabled {
            cursor: not-allowed !important;
            opacity: 0.6;
            filter: grayscale(0.8);
            transform: none !important;
            box-shadow: none !important;
        }

        @keyframes fadeIn { from { opacity:0; } to { opacity:1; } }

    </style>
</head>

<body>
    <div id="pageLoading" style="position:fixed;inset:0;background:#0F0F23;display:flex;align-items:center;justify-content:center;z-index:9999;">
        <div class="" style="color:var(--neon-cyan);font-family:var(--font-heading);font-size:1.5rem;animation:pulse 1.5s infinite;">載入中...</div>
    </div>

    <div class="shop-page" id="shopPage" style="display:none;">
        <div class="header-row">
            <a href="index.html" class="back-btn">← 返回主選單</a>
            <div class="currency-bar">
                <div class="currency-item c-money" title="錢錢"><img src="item_pic/錢錢.png" class="item-icon-inline"> <span id="v-money">0</span></div>
                <div class="currency-item c-deed" title="地契"><img src="item_pic/地契.png" class="item-icon-inline"> <span id="v-deed">0</span></div>
                <div class="currency-item" style="width:1px;background:var(--glass-border);height:16px;margin:0 5px;"></div>
                <div class="currency-item c-t1" title="普通抽獎券"><img src="item_pic/普通抽獎券.png" class="item-icon-inline"> <span id="v-ticket-normal">0</span></div>
                <div class="currency-item c-t2" title="高級抽獎券"><img src="item_pic/高級抽獎券.png" class="item-icon-inline"> <span id="v-ticket-premium">0</span></div>
                <div class="currency-item c-t3" title="特殊抽獎券"><img src="item_pic/特殊抽獎券.png" class="item-icon-inline"> <span id="v-ticket-special">0</span></div>
            </div>
        </div>

        <div class="tabs">
            <button class="tab-btn active" onclick="switchTab('gacha')" id="tab-gacha">機率抽獎</button>
            <button class="tab-btn" onclick="switchTab('shop')" id="tab-shop">資源商店</button>
        </div>

        <!-- Gacha Section -->
        <div class="tab-content active" id="content-gacha">
            <div class="gacha-container">
                <div class="pool-list" id="poolList">
                    <!-- Injected via JS -->
                </div>
                <div class="gacha-display">
                    <div class="gacha-banner" id="poolBanner">
                        ✨ 選擇獎池
                    </div>
                    <div class="gacha-rates" id="poolDesc">
                        請從左側選擇一個獎池來查看詳情。
                    </div>
                    <div class="gacha-content-list" id="poolContent">
                        <!-- Characters list injected via JS -->
                    </div>
                    <div class="gacha-actions" id="poolActions" style="display:none;">
                        <button class="btn btn-pull" id="btnPull1" onclick="performPull(1)">
                            單次抽取
                            <span class="cost" id="costPull1">-</span>
                        </button>
                        <button class="btn btn-gold btn-pull" id="btnPull10" onclick="performPull(10)">
                            十連抽取
                            <span class="cost" id="costPull10">-</span>
                        </button>
                    </div>
                </div>
            </div>
        </div>

        <!-- Shop Section -->
        <div class="tab-content" id="content-shop">
            <div class="shop-grid" id="shopGrid">
                <!-- Injected via JS -->
            </div>
        </div>

    </div>

    <!-- Gacha Animation Modal -->
    <div id="gachaAnimModal">
        <div class="gacha-modal-header">
            <h2 id="gachaAnimTitle">抽獎啟動</h2>
            <p id="gachaAnimHint">點擊能量核心，讓獎池開始轉動</p>
        </div>
        <div class="gacha-stage" id="gachaStage"></div>
        <div class="gacha-results-row is-hidden" id="gachaResults"></div>
        <div class="gacha-modal-footer">
            <button id="btnSkipAnim" onclick="skipAnim()">快速啟動</button>
            <button id="btnRevealAll" onclick="revealAll()">一鍵全部翻開</button>
        </div>
    </div>

</body>
</html>
